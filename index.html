/* Layout: app de juego a pantalla completa. Escenario con cámara sobre el tablero, barra de control abajo y, en pantallas anchas, libro del banco a la derecha. En móvil los paneles suben como hojas. */
:root{
  --bg:#0b1219; --bg-hi:#172636; --surface:#141f2a; --surface-2:#1b2a37; --surface-3:#233547; --line:#263849; --line-2:#344a5e;
  --ink:#f1f4f6; --muted:#97a8b6; --faint:#687b8b;
  --brass:#e0ac4c; --brass-hi:#f3cb7b; --brass-dk:#8d6521; --on-brass:#231806;
  --good:#5fd197; --bad:#f2806f;
  --board:#e6efe2; --board-2:#d6e4d1; --board-ink:#162019; --board-line:#3b4b43; --paper:#fffcf3; --paper-ink:#161616;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-ui:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-board:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(1100px 700px at 30% -15%,var(--bg-hi),transparent 70%);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.4;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-optical-sizing:auto}
input{-webkit-user-select:text;user-select:text}
button,select,input{font-family:inherit;touch-action:manipulation}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
html.wide .only-m{display:none!important}
html:not(.wide) .only-w{display:none!important}

/* ---------- estructura ---------- */
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"top" "strip" "stage" "dock";gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 10px}
html.pwa #app{padding-top:env(safe-area-inset-top,0px);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
html.wide #app{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top" "stage side" "dock side";gap:12px 16px;padding-bottom:16px}

/* cabecera */
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding-top:10px}
.brand{display:flex;align-items:center;gap:9px}
.brand .mark{width:32px;height:32px;color:var(--brass)}
.brand b{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1}
.brand small{display:block;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.round{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctrls{margin-left:auto;display:flex;align-items:center;gap:6px}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;min-width:38px;padding:0 11px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--f-ui);cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.ib:hover{background:var(--surface-2);border-color:var(--line-2)}
.ib:active{transform:scale(.95)}
.ib.on{border-color:var(--brass);color:var(--brass-hi)}
.ib .ic{width:18px;height:18px}
.spd{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 4px 0 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.spd select{background:transparent;color:var(--ink);border:0;font:600 13px var(--f-ui);height:36px;padding:0 4px;cursor:pointer;outline:none}
.spd select option{background:var(--surface)}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}

/* tira de jugadores (móvil) */
#strip{grid-area:strip;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sp{display:flex;align-items:center;gap:6px;padding:6px 6px;overflow:hidden;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);cursor:pointer;min-width:0;position:relative;text-align:left;transition:border-color .25s,background .25s,transform .25s var(--ease)}
.sp.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,var(--surface));transform:translateY(-1px)}
.sp.out{opacity:.38}
.sp .disc{width:22px;height:22px}
.sp .t{min-width:0;display:flex;flex-direction:column}
.sp .n{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.sp .m{font-size:12px;font-weight:800;color:var(--brass-hi);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.sp .bdg{position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;background:#7a3b1f;color:#ffd0ad;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.sp .bdg .ic{width:10px;height:10px}

/* ---------- escenario y cámara ---------- */
#stage{grid-area:stage;position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);background:radial-gradient(120% 90% at 50% 40%,var(--st-a) 0%,var(--st-b) 70%);touch-action:none;min-height:0}
#cam{position:absolute;inset:0;cursor:grab}
#cam.drag{cursor:grabbing}
#board{position:absolute;left:0;top:0;transform-origin:0 0;width:var(--S);height:var(--S);display:grid;grid-template-columns:var(--k) repeat(9,var(--c)) var(--k);grid-template-rows:var(--k) repeat(9,var(--c)) var(--k);background:var(--board);border:4px solid #17211c;box-shadow:0 40px 90px -10px rgba(0,0,0,.7),0 0 0 14px var(--frame),0 0 0 16px #0a120f;border-radius:10px;color:var(--board-ink);font-family:var(--f-board)}
.sq{position:relative;overflow:hidden;box-shadow:inset 0 0 0 .6px var(--board-line);cursor:pointer;background:var(--board)}
.sq:hover{background:#eff6ec}
.in{position:absolute;left:50%;top:50%;width:var(--c);height:var(--k);transform:translate(-50%,-50%) rotate(var(--rot,0deg));display:flex;flex-direction:column;align-items:center;text-align:center}
.corner .in{width:var(--k);height:var(--k);justify-content:center}
.band{width:100%;height:21%;flex:none;box-shadow:inset 0 -.6px 0 var(--board-line);display:flex;align-items:center;justify-content:center;gap:2px}
.nm{flex:1;display:flex;align-items:center;justify-content:center;padding:2px 4px;font-weight:700;font-size:calc(var(--c)*.158);line-height:1.04;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere;min-height:0}
.nm.top{flex:none;padding-top:9%}
.bi{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.bi svg{width:calc(var(--c)*.5);height:calc(var(--c)*.5)}
.pr{font-size:calc(var(--c)*.165);font-weight:600;padding-bottom:calc(var(--c)*.15);font-variant-numeric:tabular-nums}
.own{position:absolute;left:0;right:0;bottom:0;height:calc(var(--c)*.11)}
.sq.mort .in::after{content:"HIPOTECADA";position:absolute;inset:21% 0 calc(var(--c)*.11);display:grid;place-items:center;background:repeating-linear-gradient(45deg,rgba(255,255,255,.75) 0 5px,rgba(190,50,40,.22) 5px 10px);color:#8b1111;font-weight:800;font-size:calc(var(--c)*.12)}
.h{display:block;width:calc(var(--c)*.18);height:calc(var(--c)*.18);background:#1f9d4c;clip-path:polygon(50% 0,100% 42%,100% 100%,0 100%,0 42%)}
.H{display:block;width:calc(var(--c)*.48);height:calc(var(--c)*.2);background:#cf2e24;clip-path:polygon(12% 0,88% 0,100% 30%,100% 100%,0 100%,0 30%)}
.sq.flash{animation:flash 1.2s ease}
@keyframes flash{0%,100%{box-shadow:inset 0 0 0 .6px var(--board-line)}30%{box-shadow:inset 0 0 0 6px var(--brass)}}

/* ---------- modales (hojas en móvil) ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(4,8,12,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.md{background:var(--surface);border:1px solid var(--line-2);border-bottom:0;border-radius:26px 26px 0 0;width:100%;max-height:92dvh;overflow:auto;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -30px 70px rgba(0,0,0,.6);animation:sheetUp .38s var(--ease);position:relative}
.md::before{content:"";position:absolute;left:50%;top:8px;width:40px;height:5px;border-radius:5px;background:var(--line-2);transform:translateX(-50%)}
html.wide .ov{align-items:center;padding:24px}
html.wide .md{width:min(540px,100%);border-radius:22px;border-bottom:1px solid var(--line-2);max-height:calc(100dvh - 48px);padding:24px;animation:pop .25s var(--ease)}
html.wide .md::before{display:none}
html.wide .md.wide{width:min(760px,100%)}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mh h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:-.02em;line-height:1.15;text-wrap:balance;flex:1}
.mh .hq{width:32px;height:32px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;justify-content:flex-end}
html:not(.wide) .acts .btn{flex:1 1 auto;min-height:48px}
.acts:empty{display:none}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(10px) scale(.97);opacity:0}}
@keyframes sheetUp{from{transform:translateY(60%);opacity:.4}}
.note{color:var(--muted);font-size:14px;line-height:1.5;margin:0}
.note b,.gold{color:var(--brass-hi)}
.lead{font-size:15.5px;line-height:1.5;margin:0}
.deed{background:var(--paper);color:var(--paper-ink);width:250px;max-width:100%;border-radius:6px;padding:10px;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.45);margin:0 auto;font-variant-numeric:tabular-nums;font-family:var(--f-ui)}
.deed .hd{background:var(--gc);color:var(--gt);border:2px solid #161616;text-align:center;padding:8px 5px;margin-bottom:8px;border-radius:2px}
.deed .hd small{display:block;font-size:9.5px;letter-spacing:.2em;font-weight:800}
.deed .hd b{display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.1;margin-top:3px;letter-spacing:-.01em}
.deed .r{display:flex;justify-content:space-between;padding:2px 6px;border-radius:4px}
.deed .r.cur{background:#ffe7a3;font-weight:800}
.deed hr{border:0;border-top:1px solid #c9c4b6;margin:7px 0}
.deed .ft{font-size:11.5px;text-align:center;color:#555;margin-top:6px;line-height:1.35}
.deed .own{font-weight:700;color:#1d1d1d;font-size:12.5px}
.deed p{margin:5px;text-align:center}
.split{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.split>.side{flex:1;min-width:200px;display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums}
.gcard{width:min(320px,100%);margin:0 auto;border-radius:20px;padding:24px 20px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.45);animation:flip .6s var(--ease);position:relative}
.gcard.chance{background:linear-gradient(160deg,#f8bd62,#f09a35);color:#3d2304}.gcard.chest{background:linear-gradient(160deg,#bfe5f7,#93cdea);color:#0f3550}
.gcard .t{font-weight:800;font-size:12px;letter-spacing:.24em}
.gcard .sym{height:66px;display:grid;place-items:center;margin:8px 0}
.gcard .sym svg{width:54px;height:54px}
.gcard .sym .q{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1}
.gcard p{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.28;margin:0;letter-spacing:-.01em}
.gcard .whoc{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:700;margin-top:16px;opacity:.85}
@keyframes flip{from{transform:perspective(700px) rotateY(80deg) scale(.88);opacity:0}}
.mtop{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13.5px;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--line)}
.mtop b{color:var(--ink)}
.grp-h{display:flex;align-items:center;gap:8px;margin-top:16px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.sw{width:12px;height:16px;border-radius:3px;background:var(--cc);box-shadow:0 0 0 1px rgba(255,255,255,.2);flex:none}
.tagm{font-size:10px;background:var(--brass);color:var(--on-brass);padding:2px 7px;border-radius:9px;letter-spacing:.06em}
.mrow{display:flex;align-items:center;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mrow .nm2{flex:1;min-width:160px;font-weight:700}
.mrow .nm2 small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:1px}
.mrow .bt{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:22px;padding:5px 14px 5px 5px;display:flex;align-items:center;gap:8px;cursor:pointer;font:600 13.5px var(--f-ui)}
.tab.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.tab small{color:var(--muted);font-weight:600}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tcol h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.tchip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;margin-bottom:5px;font-size:13.5px;width:100%;color:var(--ink);text-align:left;font-family:inherit}
.tchip.sel{border-color:var(--brass);background:#3a3218}
.tchip:disabled{opacity:.36;cursor:not-allowed}
.tchip small{margin-left:auto;color:var(--muted);font-size:12px}
.cashrow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;flex-wrap:wrap;color:var(--muted)}
.cashrow input[type=number]{width:110px;background:var(--bg);border:1px solid var(--line-2);color:var(--ink);border-radius:10px;padding:8px 10px;font:700 15px var(--f-ui)}
.reply{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:14px;min-height:48px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.reply .thinking{height:auto;border:0;background:none;flex:none}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sum>div{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.sum ul{margin:0;padding-left:18px;line-height:1.6}
.sum h4{margin:0 0 6px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.14em}
.abid{font-family:var(--f-display);font-weight:800;font-size:46px;color:var(--brass-hi);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.apl{display:flex;align-items:center;gap:9px;padding:7px 9px;font-size:14px;border-radius:10px}
.apl.passed{opacity:.38}
.apl.passed .an{text-decoration:line-through}
.apl.turn{background:var(--surface-2);font-weight:800}
.apl .am{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.alead{font-size:13px;color:var(--brass-hi);font-weight:700}
.rank{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.rank>div{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:14px}
.rank .pos{font-family:var(--f-display);font-weight:800;font-size:20px;width:26px;color:var(--brass-hi)}
.rank small{display:block;color:var(--muted);font-size:12px}
.orow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1px solid transparent;transition:border-color .2s,background .2s,opacity .2s}
.orow.active{border-color:var(--brass)}
.orow.win{background:#3a3218;border-color:var(--brass)}
.orow.lose{opacity:.5}
.orow .on2{font-weight:700;flex:1}
.orow .odice{display:flex;gap:6px}
.orow .otot{font-family:var(--f-display);font-weight:800;font-size:24px;width:34px;text-align:right;color:var(--brass-hi);font-variant-numeric:tabular-nums}
.olist{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.fl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:8px;display:block}
.help{display:grid;grid-template-columns:190px 1fr;gap:18px}
.hnav{display:flex;flex-direction:column;gap:2px}
.hnav button{text-align:left;background:transparent;border:0;color:var(--muted);padding:7px 10px;border-radius:9px;font:600 13.5px var(--f-ui);cursor:pointer}
.hnav button:hover{background:var(--surface-2);color:var(--ink)}
.hnav button.on{background:var(--surface-3);color:var(--brass-hi)}
.hbody h3{margin:0 0 8px;font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:-.01em}
.hbody p,.hbody li{font-size:14.5px;line-height:1.55;color:#d3dde2;margin:0 0 8px}
.hbody ul,.hbody ol{padding-left:20px;margin:0 0 8px}
.hbody b{color:var(--ink)}
.menu{display:flex;flex-direction:column;gap:14px}
.mitem{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font:700 15px var(--f-ui);cursor:pointer;text-align:left}
.mitem .ic{width:20px;height:20px;color:var(--brass)}
.mitem small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.urlbox{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:8px 8px 8px 12px;margin:10px 0}
.urlbox code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px;color:var(--brass-hi);-webkit-user-select:all;user-select:all}
.steps{counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;margin-bottom:12px!important}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--brass);color:var(--on-brass);font-weight:800;display:grid;place-items:center;font-size:13px}
.kbd{display:inline-flex;align-items:center;gap:4px;background:var(--surface-3);padding:1px 7px;border-radius:6px;font-weight:700;color:var(--ink);white-space:nowrap}
.kbd .ic{width:14px;height:14px}

/* ---------- inicio ---------- */
.start{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:flex;padding:28px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
html.pwa .start{padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.start::before{content:"";position:fixed;inset:-20%;background:radial-gradient(600px 420px at 20% 10%,rgba(57,96,128,.45),transparent 70%),radial-gradient(520px 420px at 90% 90%,rgba(224,172,76,.18),transparent 70%);animation:drift 18s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate(4%,3%) rotate(3deg)}}
.sgrid{position:relative;margin:auto;width:min(1000px,100%);display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:center}
.hero .mark{width:64px;height:64px;color:var(--brass);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-3deg)}}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(58px,11vw,112px);line-height:.88;margin:18px 0 10px;letter-spacing:-.05em;background:linear-gradient(180deg,#fff 30%,#c9d6df);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .kick{font-weight:800;letter-spacing:.32em;text-transform:uppercase;color:var(--brass);font-size:13px}
.hero p{font-size:18px;line-height:1.5;color:#c7d3da;max-width:44ch;margin:18px 0 0}
.hero ul{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:12px}
.hero li{display:flex;gap:12px;align-items:flex-start;color:#c7d3da;font-size:15px}
.hero li .ic{color:var(--brass);width:20px;height:20px;margin-top:1px}
.scard{background:rgba(20,31,42,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line-2);border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:0 40px 80px -24px rgba(0,0,0,.7)}
.scard h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em}
#pname{background:var(--bg);border:1px solid var(--line-2);color:var(--ink);border-radius:14px;padding:12px 14px;font:700 17px var(--f-ui);width:100%}
#pname:focus{outline:2px solid var(--brass);outline-offset:1px}
.tokpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tokpick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px 9px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;font:600 12px var(--f-ui);transition:transform .15s var(--ease),border-color .2s}
.tokpick button .disc{width:38px;height:38px}
.tokpick button.on{border-color:var(--brass);color:var(--ink);background:#2c2a1d;transform:translateY(-2px)}
.rivals{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.mystery{width:32px;height:32px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--muted);box-shadow:0 0 0 2px var(--line-2)}
.sacts{display:flex;flex-direction:column;gap:8px}
.sacts .btn{width:100%}




/* ---------- fichas (nuevo diseño) ---------- */
.disc{position:relative;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;flex:none;
  background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--pc) 45%,#fff) 0%,var(--pc) 46%,color-mix(in srgb,var(--pc) 62%,#000) 100%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -3px 5px rgba(0,0,0,.28),0 0 0 1.5px color-mix(in srgb,var(--pc) 55%,#000),0 3px 7px rgba(0,0,0,.4)}
.disc::after{content:"";position:absolute;inset:11%;border-radius:50%;border:1px solid rgba(255,255,255,.32);pointer-events:none}
.disc svg{width:56%;height:56%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));position:relative;z-index:1}
.disc.sm{width:22px;height:22px;box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -2px 3px rgba(0,0,0,.25),0 0 0 1px color-mix(in srgb,var(--pc) 55%,#000)}
.disc.sm::after{display:none}
.tok{box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -4px 7px rgba(0,0,0,.3),0 0 0 3px #fff,0 7px 12px rgba(0,0,0,.45)}
.tok.cur{box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -4px 7px rgba(0,0,0,.3),0 0 0 3px #fff,0 0 0 8px var(--brass),0 10px 18px rgba(0,0,0,.45)}
/* ---------- inicio tipo app ---------- */
.start.home{display:block;padding:0;overflow:auto;overscroll-behavior:none}
.home-in{position:relative;min-height:100%;display:flex;flex-direction:column;gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));max-width:1180px;margin:0 auto}
html.pwa .home-in{padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.home-top{display:flex;align-items:center;gap:10px}
.home-logo{display:flex;align-items:center;gap:9px;margin-right:auto}
.home-logo .mark{width:34px;height:34px;color:var(--brass)}
.home-logo b{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.03em}
.pchip{display:flex;align-items:center;gap:9px;height:46px;padding:0 14px 0 4px;border-radius:24px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit}
.pchip .disc{width:38px;height:38px}
.pchip b{display:block;font-size:14px;font-weight:800;line-height:1.1;text-align:left;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip small{display:block;font-size:11px;color:var(--brass-hi);font-weight:700;text-align:left}
.iconbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.iconbtn .ic{width:21px;height:21px}
.tiles{flex:1;display:grid;grid-auto-rows:minmax(196px,1fr);gap:12px}
html.wide .tiles{grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(420px,1fr)}
.tile{position:relative;overflow:hidden;border-radius:26px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;color:#fff;isolation:isolate;
  box-shadow:0 18px 40px -16px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .2s var(--ease),box-shadow .3s;animation:tileIn .5s var(--ease) both}
.tile:nth-child(2){animation-delay:.06s}.tile:nth-child(3){animation-delay:.12s}
@keyframes tileIn{from{opacity:0;transform:translateY(16px) scale(.98)}}
.tile:active{transform:scale(.985)}
.tile::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--tbg)}
.tile::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.12) 55%,transparent 75%)}
html.wide .tile::after{background:linear-gradient(0deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,.15) 55%,transparent 75%)}
.t-clasico{--tbg:radial-gradient(120% 140% at 85% 20%,#2f7a5c 0%,#174535 45%,#0c241c 100%);--tac:#7be0b0}
.t-golpe{--tbg:radial-gradient(120% 140% at 85% 20%,#9a3540 0%,#5a1b26 45%,#230b12 100%);--tac:#ffad9f}
.t-imperio{--tbg:radial-gradient(120% 140% at 85% 20%,#4652a8 0%,#25306b 45%,#0f1433 100%);--tac:#c1c8ff}
.t-art{position:absolute;right:-6%;top:50%;width:62%;max-width:300px;transform:translateY(-50%);z-index:-1;pointer-events:none;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}
html.wide .t-art{top:6%;right:50%;transform:translateX(50%);width:82%;max-width:340px}
.t-art svg{width:100%;height:auto;display:block;animation:artFloat 6s ease-in-out infinite}
@keyframes artFloat{50%{transform:translateY(-6px) rotate(-1deg)}}
.t-body{position:relative;display:flex;flex-direction:column;gap:6px;max-width:68%}
html.wide .t-body{max-width:none}
.t-kick{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--tac)}
.tile h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8.5vw,42px);line-height:.95;letter-spacing:-.04em}
.tile p{margin:0;font-size:13.5px;line-height:1.35;color:rgba(255,255,255,.82)}
.t-live{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:4px;padding:6px 11px 6px 9px;border-radius:20px;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.18)}
.t-live b{font-weight:800;letter-spacing:.14em;color:#8ff0b8;font-size:11px}
.t-live{white-space:nowrap;max-width:100%}.t-live b{white-space:nowrap}.t-live span{overflow:hidden;text-overflow:ellipsis}
.t-live .dot{width:9px;height:9px;border-radius:50%;background:#5fe39b;box-shadow:0 0 0 0 rgba(95,227,155,.7);animation:live 1.6s infinite}
@keyframes live{70%{box-shadow:0 0 0 8px rgba(95,227,155,0)}100%{box-shadow:0 0 0 0 rgba(95,227,155,0)}}
.t-info{font-size:12px;font-weight:700;color:rgba(255,255,255,.75);display:flex;gap:6px;flex-wrap:wrap}
.t-info span{background:rgba(0,0,0,.28);padding:3px 9px;border-radius:12px}
.tile.live{box-shadow:0 18px 40px -16px rgba(0,0,0,.7),inset 0 0 0 2px rgba(95,227,155,.55)}
.t-acts{display:flex;gap:8px;margin-top:8px}
.t-acts .btn{height:44px;border-radius:14px}
.btn.glass{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn.white{background:#fff;color:#151b22;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.t-badge{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:14px;background:var(--brass);color:var(--on-brass);animation:pulseBtn 2.2s infinite}
.t-badge .ic{width:14px;height:14px}
.home-toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:16px;background:#173326;border:1px solid var(--good);color:var(--ink);font-size:13.5px;font-weight:600;box-shadow:0 14px 30px rgba(0,0,0,.5);animation:tin .4s var(--ease);max-width:calc(100% - 32px)}
.home-toast .ic{color:var(--good);width:18px;height:18px}
.home-foot{display:flex;justify-content:center}
.home-foot .btn{font-size:13px}
.tokgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tokgrid button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;font:700 12px var(--f-ui);transition:transform .15s var(--ease)}
.tokgrid button .disc{width:44px;height:44px}
.tokgrid button.on{border-color:var(--brass);color:var(--ink);background:#2e2b1b;transform:translateY(-2px)}
.tokgrid button:disabled{opacity:.42;cursor:not-allowed}
.prof-head{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--surface-2)}
.prof-head .disc{width:64px;height:64px}
.prof-head b{font-family:var(--f-display);font-size:22px;font-weight:800;display:block}
#pname{background:var(--bg);border:1px solid var(--line-2);color:var(--ink);border-radius:14px;padding:12px 14px;font:700 17px var(--f-ui);width:100%}
.mitem.danger .ic{color:var(--bad)}.mitem.danger{color:#ffc4bc}
@media (max-height:720px){html:not(.wide) .tile p{display:none}}
/* ---------- temas y dados ---------- */
:root{--st-a:#1d3240;--st-b:#101b25;--frame:#20302a;--die-a:#ffffff;--die-b:#ecebe3;--pip-c:#1d1d1d}
html[data-theme="atardecer"]{--st-a:#57303a;--st-b:#1b1016;--frame:#3b2420}
html[data-theme="bosque"]{--st-a:#1f4a35;--st-b:#0c1d14;--frame:#123222}
html[data-theme="mar"]{--st-a:#1a4572;--st-b:#0a1626;--frame:#163150}
html[data-dice="oro"]{--die-a:#ffe9a8;--die-b:#e0ac4c;--pip-c:#3a2606}
html[data-dice="rojo"]{--die-a:#ee6a5c;--die-b:#b52a20;--pip-c:#fff}
html[data-dice="negro"]{--die-a:#3f474f;--die-b:#16191d;--pip-c:#f3cb7b}
/* ---------- Imperio ---------- */
.pill.boss{background:#3a3016;color:var(--brass-hi)}.pill.debt{background:#3d2430;color:#ffb8c9}
#evChip{position:absolute;left:10px;bottom:10px;z-index:5;max-width:min(300px,calc(100% - 70px));display:flex;gap:8px;align-items:flex-start;padding:7px 11px;border-radius:12px;cursor:pointer;background:rgba(16,26,35,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--brass);font-size:12.5px;line-height:1.35;color:var(--muted)}
#evChip .ic{color:var(--brass-hi);width:17px;height:17px;margin-top:1px}
#evChip b{display:block;color:var(--ink);font-size:12.5px}
#evChip span span{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px}
.ic.st.on{color:var(--brass-hi)}.ic.lv.on{color:var(--bad)}
.hubwrap{position:relative;margin:0 auto;width:min(760px,100%);display:flex;flex-direction:column;gap:16px}
.hub-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hub-title small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);font-weight:800}
.hub-title b{display:block;font-family:var(--f-display);font-weight:800;font-size:36px;letter-spacing:-.04em;line-height:1}
.hub-stats{margin-left:auto;display:flex;gap:8px}
.hstat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-width:120px}
.hstat small{display:block;font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.hstat b{font-family:var(--f-display);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.xpbar{height:6px;border-radius:6px;background:var(--surface-3);margin-top:5px;overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-hi))}
.daily{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:linear-gradient(120deg,#3d3216,#1d2b38);border:1px solid var(--brass);color:var(--ink);text-align:left;cursor:pointer;font-family:inherit;animation:pulseBtn 2.4s ease-in-out infinite}
.daily .ic{width:32px;height:32px;color:var(--brass-hi)}
.daily.resume{background:linear-gradient(120deg,#1c3a2c,#1d2b38);border-color:var(--good);animation:none}.daily.resume .ic{color:var(--good)}
.daily b{display:block;font-family:var(--f-display);font-size:17px}.daily small{color:var(--muted);font-size:12.5px}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font:700 13px var(--f-ui);cursor:pointer}
.hbtn .ic{width:24px;height:24px;color:var(--brass)}
.hbtn .note{font-size:11px}
.hbtn .badge{position:absolute;top:7px;right:7px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.season{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.season b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.season span{color:var(--muted);font-size:13px}
.zpath{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:26px}
.zpath::before{content:"";position:absolute;left:10px;top:14px;bottom:14px;width:3px;border-radius:3px;background:linear-gradient(var(--brass),var(--line-2))}
.zcard{position:relative;display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-align:left;cursor:pointer;font-family:inherit;width:100%;transition:transform .15s var(--ease)}
.zcard:active{transform:scale(.985)}
.zcard::before{content:"";position:absolute;left:-22px;top:50%;width:13px;height:13px;border-radius:50%;background:var(--surface-3);border:3px solid var(--bg);transform:translateY(-50%)}
.zcard.done::before{background:var(--good)}.zcard.cur::before{background:var(--brass);box-shadow:0 0 0 5px rgba(224,172,76,.25)}
.zcard.cur{border-color:var(--brass);background:linear-gradient(120deg,#2e2b1b,var(--surface))}
.zcard.locked{opacity:.45;cursor:not-allowed}
.znum{width:42px;height:42px;border-radius:12px;background:var(--surface-3);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;flex:none}
.znum .ic{width:18px;height:18px;color:var(--muted)}
.zinfo{flex:1;min-width:0}
.zinfo b{display:block;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.zinfo small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.zside{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.stars,.lives{display:inline-flex;gap:2px;vertical-align:middle}.stars .ic{width:17px;height:17px;color:var(--line-2)}.lives .ic{width:14px;height:14px;color:var(--line-2)}
.bosscard{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:linear-gradient(120deg,#3a2422,var(--surface-2));border:1px solid #6b3a33}
.bosscard small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bad);font-weight:800}
.bosscard b{display:block;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.branch{background:var(--surface-2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:7px}
.branch h4{margin:0 0 2px;display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-size:16px}
.branch h4 .ic{color:var(--brass)}
.node{display:flex;align-items:flex-start;gap:7px;padding:8px;border-radius:10px;background:var(--bg);font-size:12.5px;color:var(--muted);border:1px solid transparent;line-height:1.35}
.node .ic{width:14px;height:14px;margin-top:1px}
.node.on{color:var(--ink);background:#2e2b1b;border-color:var(--brass)}.node.on .ic{color:var(--brass-hi)}
.alb{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.alb span{font-size:11.5px;padding:3px 8px;border-radius:8px;background:var(--surface-2);color:var(--faint);border-left:4px solid var(--line-2)}
.alb span.on{color:var(--ink);border-left-color:var(--cc);background:var(--surface-3)}
.ach>.ic{width:22px;height:22px;color:var(--faint)}.ach.on>.ic{color:var(--brass-hi)}.ach:not(.on) .nm2{color:var(--muted)}
.lkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lk{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;font-family:inherit;text-align:center}
.lk b{font-size:13px}.lk small{font-size:11px;color:var(--muted)}
.lk.on{border-color:var(--brass);background:#2e2b1b}.lk:disabled{opacity:.45;cursor:not-allowed}
.lk .sample{width:44px;height:30px;border-radius:8px}
.lk-theme-noche .sample{background:radial-gradient(#1d3240,#101b25)}.lk-theme-atardecer .sample{background:radial-gradient(#57303a,#1b1016)}.lk-theme-bosque .sample{background:radial-gradient(#1f4a35,#0c1d14)}.lk-theme-mar .sample{background:radial-gradient(#1a4572,#0a1626)}
.lk-dice-clasico .sample{background:linear-gradient(145deg,#fff,#ecebe3)}.lk-dice-rojo .sample{background:linear-gradient(145deg,#ee6a5c,#b52a20)}.lk-dice-oro .sample{background:linear-gradient(145deg,#ffe9a8,#e0ac4c)}.lk-dice-negro .sample{background:linear-gradient(145deg,#3f474f,#16191d)}
.tokpick button:disabled{opacity:.4;cursor:not-allowed}
@media (max-width:560px){.tree{grid-template-columns:1fr}.lkgrid{grid-template-columns:repeat(2,1fr)}.hub-stats{margin-left:0;width:100%}.hstat{flex:1}}
/* ---------- El Golpe ---------- */
#loot{background:var(--bg);border:1px solid var(--line-2);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;animation:tin .35s var(--ease)}
.lt-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lt-t{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lt-t .ic{color:var(--brass);width:15px;height:15px}
.lt-v{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--brass-hi);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lt-items{display:flex;flex-wrap:wrap;gap:5px}
.lchip{font-size:12px;font-weight:700;padding:3px 9px 3px 7px;border-radius:20px;background:var(--surface-2);display:inline-flex;align-items:center;gap:5px;animation:pop .3s var(--ease)}
.lchip::before{content:"";width:8px;height:12px;border-radius:2px;background:var(--cc,var(--brass))}
.lchip.cash{color:var(--brass-hi)}.lchip.cash::before{display:none}
.risk{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center;font-size:12px;color:var(--muted)}
.risk b{font-size:15px;font-variant-numeric:tabular-nums}.risk b.lo{color:var(--good)}.risk b.mid{color:var(--brass-hi)}.risk b.hi{color:var(--bad)}
.rbar{grid-column:1/3;height:7px;border-radius:7px;background:var(--surface-3);overflow:hidden}
.rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--brass) 50%,var(--bad));border-radius:7px;transition:width .5s var(--ease)}
.sq.police{background:#f5ddd6}.sq.police:hover{background:#f8e6e1}
.pol-ic{color:#b8322a}
.own.pend{background:repeating-linear-gradient(90deg,var(--pc) 0 7px,transparent 7px 12px)!important;animation:pend 1s ease-in-out infinite alternate}
@keyframes pend{to{opacity:.45}}
.gcard.golpe{background:linear-gradient(160deg,#2b3a4a,#16212c);color:#f1f4f6;border:1px solid var(--brass)}
.gcard.golpe .t{color:var(--brass-hi)}.gcard.golpe .sym svg{color:var(--brass-hi)}
#banner .bx.big{padding:14px 30px}
#banner .bx.big b{font-size:34px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;text-align:left;font-family:inherit;transition:transform .15s var(--ease),border-color .2s}
.mode b{font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.mode b .ic{width:17px;height:17px;color:var(--brass)}
.mode small{font-size:12px;color:var(--muted);line-height:1.35}
.mode.on{border-color:var(--brass);background:#2c2a1d;transform:translateY(-2px)}
.mode:disabled{opacity:.45;cursor:not-allowed}
.mode .soon{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--on-brass);background:var(--brass);padding:1px 6px;border-radius:8px}
@media (max-width:560px){.modes{grid-template-columns:1fr}.mode{flex-direction:row;flex-wrap:wrap;align-items:center}.mode small{flex-basis:100%}}
@media (max-width:999px),(max-aspect-ratio:5/4){
  .sgrid{grid-template-columns:1fr;gap:26px}
  .hero ul{display:none}
  .hero p{font-size:16px}
}
@media (max-width:560px){
  .tcols,.sum{grid-template-columns:1fr}
  .help{grid-template-columns:1fr}
  .hnav{flex-direction:row;flex-wrap:wrap}
  .brand small{display:none}
}
@media (max-height:700px){html:not(.wide) #tabs{display:none}}
html:not(.wide) #dock:has(#loot:not([hidden])) #tabs{display:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

'use strict';
/* =================== iconos propios (SVG) =================== */
const ICONS={
  mark:'<rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="currentColor" stroke="none"/><path d="M6.5 17V8l5.5 5.5L17.5 8v9" stroke="#16212c" stroke-width="2.3"/>',

async function idbGet(k){const db=await idbOpen();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}})}

function rentBase(i,dice,mode){
  const sq=BOARD[i],st=G.props[i];
  if(st.owner==null||st.mort)return 0;
  if(sq.type==='street'){if(st.houses)return sq.rent[st.houses];return ownsAll(st.owner,sq.group)?sq.rent[0]*2:sq.rent[0]}
  if(sq.type==='rail'){const n=GROUPS.rail.idx.filter(j=>G.props[j].owner===st.owner).length;const r=25*2**(n-1);return mode==='rail2'?r*2:r}
  const n=GROUPS.util.idx.filter(j=>G.props[j].owner===st.owner).length;
  return (mode==='util10'||n===2?10:4)*dice;
}
function buildErr(i){
  const sq=BOARD[i],st=G.props[i];
  if(sq.type!=='street')return 'No se puede edificar';
  const g=GROUPS[sq.group];
  if(st.owner==null||!ownsAll(st.owner,sq.group))return 'Necesitas todo el grupo de color';
  if(g.idx.some(j=>G.props[j].mort))return 'Hay una propiedad hipotecada en el grupo';
  if(st.houses>=5)return 'Ya tiene hotel';
  if(st.houses>Math.min(...g.idx.map(j=>G.props[j].houses)))return 'Hay que construir de forma uniforme';
  if(st.houses===4&&G.hotels<1)return 'No quedan hoteles en el banco';
  if(st.houses<4&&G.houses<1)return 'No quedan casas en el banco';
  if(P(st.owner).money<houseCost(sq.group,st.owner))return 'No tienes dinero suficiente';
  return '';
}
function build(i){const st=G.props[i];P(st.owner).money-=houseCost(BOARD[i].group,st.owner);if(st.houses===4){G.hotels--;G.houses+=4}else G.houses--;st.houses++}
function sellErr(i){
  const sq=BOARD[i],st=G.props[i];
  if(sq.type!=='street'||!st.houses)return 'No hay edificios';
  if(st.houses<Math.max(...GROUPS[sq.group].idx.map(j=>G.props[j].houses)))return 'Hay que vender de forma uniforme';
  return '';
}
function sell(i){
  const st=G.props[i],g=GROUPS[BOARD[i].group],p=P(st.owner),half=g.house/2;
  if(st.houses===5){const keep=Math.min(4,G.houses);G.hotels++;G.houses-=keep;p.money+=half*(5-keep);st.houses=keep}
  else{G.houses++;st.houses--;p.money+=half}
}
function mortErr(i){const sq=BOARD[i],st=G.props[i];if(st.mort)return 'Ya está hipotecada';if(sq.type==='street'&&groupBuilt(sq.group))return 'Vende antes los edificios del grupo';return ''}

function liquidValue(p){let v=p.money;for(const i of propsOf(p.id)){const st=G.props[i];if(st.houses)v+=st.houses*GROUPS[BOARD[i].group].house/2;if(!st.mort)v+=BOARD[i].price/2}return v}
function netWorth(p){let v=p.money;for(const i of propsOf(p.id)){const st=G.props[i];v+=st.mort?BOARD[i].price/2:BOARD[i].price;if(st.houses)v+=st.houses*GROUPS[BOARD[i].group].house}return v}

function setMoney(node,v){
  if(!node)return;
  const from=node._v??v;node._v=v;cancelAnimationFrame(node._raf||0);
  if(from===v){node.textContent=fmt(v);return}
  const t0=performance.now(),D=700;
  const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);node.textContent=fmt(from+(v-from)*e);if(k<1)node._raf=requestAnimationFrame(step)};
  node._raf=requestAnimationFrame(step);
}

function modal({title,html,cls='',onClose,help,closable}={}){
  const ov=el('div','ov'),md=el('div','md '+cls);ov.appendChild(md);
  md.setAttribute('role','dialog');md.setAttribute('aria-modal','true');
  if(title||help||closable){
    const mh=el('div','mh',`<h2>${title||''}</h2>`);
    if(help){const b=el('button','hq',ic('help'));b.type='button';b.title='Cómo funciona';b.setAttribute('aria-label','Cómo funciona');b.onclick=()=>openHelp(help);mh.appendChild(b)}
    if(closable){const b=el('button','hq',ic('x'));b.type='button';b.setAttribute('aria-label','Cerrar');b.onclick=()=>m.close();mh.appendChild(b)}
    md.appendChild(mh);
  }
  const body=el('div','mb');md.appendChild(body);if(html)body.innerHTML=html;
  const acts=el('div','acts');md.appendChild(acts);
  document.body.appendChild(ov);
  const m={ov,md,body,acts,closed:false,
    close(){if(m.closed)return;m.closed=true;ov.remove();onClose&&onClose()},
    btn(label,c,fn,dis,title){const b=el('button','btn '+(c||''),label);b.type='button';b.disabled=!!dis;if(title)b.title=title;b.onclick=fn;acts.appendChild(b);return b}};
  if(closable)ov.addEventListener('keydown',e=>{if(e.key==='Escape')m.close()});
  return m;
}

function tradeable(i){const sq=BOARD[i];return !(sq.type==='street'&&groupBuilt(sq.group))}
function openTrade(p,opt={}){
  const partners=G.players.filter(q=>q.id!==p.id&&!q.out);
  if(!partners.length)return;
  let partner=partners[0],give=new Set(),get=new Set(),gCash=0,rCash=0,gCard=false,rCard=false;
  const m=modal({title:'Negociar',cls:'wide',onClose:opt.onClose,help:'negociar',closable:true});

    if(!ids.length)return '<p class="note">Sin propiedades.</p>';
    return ids.map(i=>{const ok=tradeable(i);return `<button type="button" class="tchip${set.has(i)?' sel':''}" data-i="${i}" ${ok?'':'disabled title="Su grupo tiene edificios: hay que venderlos antes"'}><span class="sw" style="--cc:${gcol(i)}"></span>${BOARD[i].name}<small>${G.props[i].mort?'hipotecada':fmt(BOARD[i].price)}</small></button>`}).join('');
  };
  const draw=(reply='')=>{
    m.body.innerHTML=`<div class="tabs">${partners.map(q=>`<button type="button" class="tab${q===partner?' on':''}" data-p="${q.id}">${disc(q,'sm')}${esc(q.name)} <small>${fmt(q.money)}</small></button>`).join('')}</div>
    <div class="tcols">
      <div class="tcol" data-side="give"><h4>Tú das</h4>${chipList(p.id,give)}
        <div class="cashrow"><label for="tg">Dinero</label><input id="tg" type="number" min="0" step="10" max="${p.money}" value="${gCash}"><span>de ${fmt(p.money)}</span></div>
        ${p.cards.length?`<label class="cashrow"><input type="checkbox" id="tgc" ${gCard?'checked':''}> Carta «Libre de la cárcel»</label>`:''}</div>
      <div class="tcol" data-side="get"><h4>Pides a ${esc(partner.name)}</h4>${chipList(partner.id,get)}
        <div class="cashrow"><label for="tr">Dinero</label><input id="tr" type="number" min="0" step="10" max="${partner.money}" value="${rCash}"><span>de ${fmt(partner.money)}</span></div>
        ${partner.cards.length?`<label class="cashrow"><input type="checkbox" id="trc" ${rCard?'checked':''}> Carta «Libre de la cárcel»</label>`:''}</div>
    </div>
    <div class="reply">${reply||`<span class="note">Elige qué das y qué pides y pulsa «Proponer trato». ${esc(partner.name)} decidirá si le conviene.</span>`}</div>`;
    m.body.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{partner=P(+b.dataset.p);get=new Set();rCash=0;rCard=false;draw()});
    m.body.querySelectorAll('.tcol').forEach(col=>col.querySelectorAll('.tchip').forEach(b=>b.onclick=()=>{const s=col.dataset.side==='give'?give:get,i=+b.dataset.i;s.has(i)?s.delete(i):s.add(i);draw()}));
    const tg=m.body.querySelector('#tg'),tr=m.body.querySelector('#tr');
    tg.oninput=()=>{gCash=Math.max(0,Math.floor(+tg.value||0))};tr.oninput=()=>{rCash=Math.max(0,Math.floor(+tr.value||0))};
    const c1=m.body.querySelector('#tgc'),c2=m.body.querySelector('#trc');if(c1)c1.onchange=()=>gCard=c1.checked;if(c2)c2.onchange=()=>rCard=c2.checked;
    m.body.querySelectorAll('[data-counter]').forEach(b=>b.onclick=()=>{gCash+=+b.dataset.counter;doTrade(true)});
  };
  const doTrade=async forced=>{
    const t={a:p.id,b:partner.id,aProps:[...give],bProps:[...get],aCash:gCash,bCash:rCash,aCards:gCard?1:0,bCards:rCard?1:0};
    if(!t.aProps.length&&!t.bProps.length&&!t.aCash&&!t.bCash&&!t.aCards&&!t.bCards){draw('<span class="note">El trato está vacío: elige algo que dar o pedir.</span>');return}
    if(t.aCash>p.money){draw(`<span class="note">No tienes ${fmt(t.aCash)}.</span>`);return}
    if(t.bCash>partner.money){draw(`<span class="note">${esc(partner.name)} no tiene ${fmt(t.bCash)}.</span>`);return}
    draw(`${disc(partner,'sm')}<span class="thinking">${esc(partner.name)} lo está pensando <span class="dots"><i></i><i></i><i></i></span></span>`);
    await wait(forced?400:1100);

function maxOppRent(p){let m=0;for(const i in G.props){const st=G.props[i];if(st.owner!=null&&st.owner!==p.id&&!P(st.owner).out)m=Math.max(m,rentOf(+i,8))}return m}
function botValue(p,i){
  const sq=BOARD[i];let v=sq.price;
  const others=GROUPS[sq.group].idx.filter(j=>j!==i),mine=others.filter(j=>G.props[j].owner===p.id).length;
  if(sq.type==='street'){
    if(mine===others.length)v*=2.1;else if(mine>0)v*=1.3;
    const o0=G.props[others[0]].owner;if(o0!=null&&o0!==p.id&&others.every(j=>G.props[j].owner===o0))v*=1.6;
    v*=GW[sq.group];if(p.pers.arch==='constructor'&&mine>0)v*=1.12;
  }else if(sq.type==='rail')v*=1+.3*mine;else v*=mine?1.25:.85;
  return v;
}
function botWantsBuy(p,i){
  const pe=p.pers,price=BOARD[i].price;if(p.money<price)return false;
  const keep=Math.max(pe.buyMin,Math.min(maxOppRent(p)*.5,600)),left=p.money-price;
  if(botValue(p,i)>=price*1.5)return left>=keep*.35;
  return left>=keep;
}
function botRaise(p,amt){
  let guard=0;
  while(p.money<amt&&guard++<300){
    const mine=propsOf(p.id),cand=mine.filter(i=>!mortErr(i));
    const loose=cand.filter(i=>!(BOARD[i].type==='street'&&ownsAll(p.id,BOARD[i].group))).sort((a,b)=>BOARD[a].price-BOARD[b].price);
    if(loose.length){mortgage(loose[0]);log(`${nm(p)} hipoteca ${pn(loose[0])} para conseguir dinero`,'good');continue}
    const sellable=mine.filter(i=>!sellErr(i)).sort((a,b)=>GW[BOARD[a].group]-GW[BOARD[b].group]);
    if(sellable.length){sell(sellable[0]);log(`${nm(p)} vende un edificio de ${pn(sellable[0])}`,'good');continue}
    if(cand.length){cand.sort((a,b)=>BOARD[a].price-BOARD[b].price);mortgage(cand[0]);log(`${nm(p)} hipoteca ${pn(cand[0])} para conseguir dinero`,'good');continue}
    break;
  }
  render();return p.money>=amt;
}
function botJailChoice(p){
  const unowned=Object.values(G.props).filter(s=>s.owner==null).length;
  if(unowned>=6&&maxOppRent(p)<300){if(p.cards.length)return 'card';if(p.money>=50+p.pers.reserve)return 'pay'}
  return 'roll';
}
function botBuild(p){
  const pe=p.pers,reserve=Math.max(pe.build,Math.min(maxOppRent(p)*.6,900));
  for(const i of propsOf(p.id)){const sq=BOARD[i];if(G.props[i].mort&&sq.type==='street'&&ownsAll(p.id,sq.group)&&p.money-unmortCost(i)>=reserve){unmortgage(i);log(`${nm(p)} levanta la hipoteca de ${pn(i)}`,'pay')}}
  let n=0,hot=0,guard=0;const where=new Set();
  while(guard++<80){
    const c=propsOf(p.id).filter(i=>BOARD[i].type==='street'&&!buildErr(i));if(!c.length)break;
    c.sort((x,y)=>G.props[x].houses-G.props[y].houses||GW[BOARD[y].group]-GW[BOARD[x].group]||BOARD[y].price-BOARD[x].price);
    const i=c[0];if(p.money-houseCost(BOARD[i].group,p.id)<reserve)break;
    build(i);where.add(GROUPS[BOARD[i].group].n);if(G.props[i].houses===5)hot++;else n++;
  }
  if(n||hot){log(`${nm(p)} construye ${n?n+(n>1?' casas':' casa'):''}${n&&hot?' y ':''}${hot?hot+(hot>1?' hoteles':' hotel'):''} en el grupo ${[...where].join(', ')}`,'build');Snd.build()}
  for(const i of propsOf(p.id)){if(G.props[i].mort&&p.money-unmortCost(i)>=reserve*1.6){unmortgage(i);log(`${nm(p)} levanta la hipoteca de ${pn(i)}`,'pay')}}
  render();return n+hot;
}
function curOwners(){const m={};for(const i in G.props)m[i]=G.props[i].owner;return m}
function afterOwners(t){const m=curOwners();t.aProps.forEach(i=>m[i]=t.b);t.bProps.forEach(i=>m[i]=t.a);return m}
function structScore(pid,m){
  let s=0;
  for(const g of GORDER){
    const idx=GROUPS[g].idx,mine=idx.filter(i=>m[i]===pid);if(!mine.length)continue;
    for(const i of mine)s+=BOARD[i].price*(G.props[i].mort?.5:1);
    if(g==='rail')s+=[0,0,40,110,220][mine.length];
    else if(g==='util')s+=mine.length===2?50:0;
    else{const tot=idx.reduce((a,i)=>a+BOARD[i].price,0);if(mine.length===idx.length)s+=tot*1.25*GW[g];else if(mine.length===idx.length-1)s+=tot*.12}
  }
  return s;
}
function tradeDelta(t,pid){
  const before=curOwners(),after=afterOwners(t),other=pid===t.a?t.b:t.a;
  const d=q=>structScore(q,after)-structScore(q,before);
  const cash=pid===t.a?t.bCash-t.aCash:t.aCash-t.bCash,crd=pid===t.a?t.bCards-t.aCards:t.aCards-t.bCards;
  const recv=pid===t.a?t.bProps:t.aProps,sent=pid===t.a?t.aProps:t.bProps;
  const int=l=>l.filter(i=>G.props[i].mort).reduce((s,i)=>s+Math.round(BOARD[i].price*.05),0);
  return{me:d(pid)+cash+crd*40-int(recv),op:d(other)-cash-crd*40-int(sent)};
}
function botAccepts(pid,t){
  const q=P(pid),pe=q.pers,pays=pid===t.a?t.aCash:t.bCash;if(pays>q.money)return false;
  let rv=pe.rival,mg=pe.margin;if(isImp()&&(t.a===0||t.b===0)){const n=skill('neg');rv*=1-.12*n;mg-=15*n}
  const{me,op}=tradeDelta(t,pid);return me>0&&me-rv*Math.max(0,op)>=mg;
}
function botSelfOk(b,t){const{me,op}=tradeDelta(t,b.id);return me>0&&me-b.pers.rival*.6*Math.max(0,op)>=0}
function humanLikely(t){const{me,op}=tradeDelta(t,t.b);return me>0&&me-.4*Math.max(0,op)>=0}
function botFindDeal(b){
  const pe=b.pers,streets=GORDER.filter(g=>GW[g]).sort((x,y)=>GW[y]-GW[x]);
  for(const g of streets){
    const idx=GROUPS[g].idx,mine=idx.filter(i=>G.props[i].owner===b.id);
    if(!mine.length||mine.length===idx.length)continue;
    const miss=idx.filter(i=>G.props[i].owner!==b.id);if(miss.some(i=>G.props[i].owner==null))continue;
    const owners=[...new Set(miss.map(i=>G.props[i].owner))];if(owners.length!==1)continue;
    const T=P(owners[0]);if(T.out)continue;
    const key=b.id+'-'+T.id+'-'+g;if((G.cool[key]||0)>G.round)continue;
    const bases=[];
    for(const h of streets){if(h===g)continue;const ih=GROUPS[h].idx;if(!ih.some(i=>G.props[i].owner===T.id))continue;const mh=ih.filter(i=>G.props[i].owner!==T.id);if(mh.length&&mh.every(i=>G.props[i].owner===b.id)&&!groupBuilt(h))bases.push(mh)}
    bases.push([]);
    const spare=propsOf(b.id).filter(i=>{const gg=BOARD[i].group;if(gg===g||G.props[i].houses)return false;if(BOARD[i].type==='street'&&groupBuilt(gg))return false;const gi=GROUPS[gg].idx;if(gi.filter(j=>G.props[j].owner===b.id).length!==1)return false;return gi.filter(j=>G.props[j].owner===T.id).length+1<gi.length});
    spare.slice(0,3).forEach(i=>bases.push([i]));
    for(const giveP of bases){
      for(let cash=0;cash<=Math.max(0,b.money-pe.reserve*.5);cash+=20){
        const t={a:b.id,b:T.id,aProps:giveP,bProps:miss,aCash:cash,bCash:0,aCards:0,bCards:0};
        if(!botSelfOk(b,t))break;
        if(T.bot?botAccepts(T.id,t):humanLikely(t))return{t,key};
      }
    }
    G.cool[key]=G.round+3;
  }
  return null;
}
async function botTryTrade(b){
  const d=botFindDeal(b);if(!d)return;
  const T=P(d.t.b);
  log(`${nm(b)} propone un trato a ${nm(T)}`,'trade');
  let ok;
  if(T.bot){await sleep(900);ok=botAccepts(T.id,d.t)}
  else ok=await ask(`${esc(b.name)} te propone un trato`,tradeSummaryHTML(d.t,T.id)+`<p class="note" style="margin-top:12px">Tienes ${fmt(T.money)}. Piensa si le das un grupo completo.</p>`,[{label:'Rechazar',v:false},{label:ic('check')+'Aceptar trato',cls:'pri',v:true}],{help:'negociar'});
  if(ok&&d.t.aCash<=b.money)await execTrade(d.t);
  else{log(`${nm(T)} rechaza el trato de ${nm(b)}`,'trade');G.cool[d.key]=G.round+4}
}
async function botManage(p){

function announceGroups(pid,list){

  for(const i of list){const g=BOARD[i].group;if(seen.has(g)||!GW[g])continue;seen.add(g);if(ownsAll(pid,g))log(`${nm(P(pid))} completa el grupo ${GROUPS[g].n}: ya puede construir`,'big','star')}

async function receiveMortgaged(p,list){
  for(const i of list){
    if(p.out)return;
    const int=Math.round(BOARD[i].price/2*.1),full=unmortCost(i);

    else lift=await ask('Recibes una propiedad hipotecada',`<p class="lead">${pn(i)} está hipotecada. Debes pagar ahora el 10 % de interés (<b class="gold">${fmt(int)}</b>) o levantar la hipoteca entera (<b class="gold">${fmt(full)}</b>). Tienes ${fmt(p.money)}.</p>`,[{label:`Pagar el 10 % · ${fmt(int)}`,v:false},{label:`Levantar hipoteca · ${fmt(full)}`,cls:'pri',v:true,dis:p.money<full}],{help:'hipoteca'});
    if(lift){addMoney(p,-full);G.props[i].mort=false;log(`${nm(p)} levanta la hipoteca de ${pn(i)}`,'pay')}
    else{if(!await pay(p,int,null))return;log(`${nm(p)} paga ${fmt(int)} de interés por ${pn(i)}`,'pay')}

async function execTrade(t){
  const A=P(t.a),B=P(t.b);
  addMoney(A,t.bCash-t.aCash);addMoney(B,t.aCash-t.bCash);
  t.aProps.forEach(i=>G.props[i].owner=B.id);t.bProps.forEach(i=>G.props[i].owner=A.id);
  for(let k=0;k<t.aCards;k++)B.cards.push(A.cards.shift());
  for(let k=0;k<t.bCards;k++)A.cards.push(B.cards.shift());
  const desc=(props,cash,cn)=>[...props.map(pn),cash?fmt(cash):'',cn?'carta de libertad':''].filter(Boolean).join(', ')||'nada';
  log(`Trato cerrado: ${nm(A)} da ${desc(t.aProps,t.aCash,t.aCards)} a ${nm(B)} a cambio de ${desc(t.bProps,t.bCash,t.bCards)}`,'big','swap');
  Snd.buy();render();
  announceGroups(A.id,t.bProps);announceGroups(B.id,t.aProps);
  await receiveMortgaged(B,t.aProps.filter(i=>G.props[i].mort));
  await receiveMortgaged(A,t.bProps.filter(i=>G.props[i].mort));
}

async function pay(p,amt,to,why){
  if(amt<=0||p.out)return !p.out;
  if(p.money<amt){
    const ok=p.bot?botRaise(p,amt):await humanRaise(p,amt,to,why);
    if(!ok||p.money<amt){await bankrupt(p,to);return false}
  }
  addMoney(p,-amt);if(to){addMoney(to,amt);if(!to.bot)track('rentIn',amt)}
  Snd.pay();render();return true;
}
async function bankrupt(p,to){
  if(p.out)return;
  p.out=true;p.outOrder=++G.outCount;p.jail=false;
  for(const i of propsOf(p.id)){const st=G.props[i];if(st.houses){const g=GROUPS[BOARD[i].group];if(st.houses===5)G.hotels++;else G.houses+=st.houses;addMoney(p,st.houses*g.house/2);st.houses=0}}
  log(`${nm(p)} se declara en bancarrota${to?' ante '+nm(to):''}`,'bad','down');Snd.bust();
  const props=propsOf(p.id);
  if(to){
    addMoney(to,p.money);p.money=0;props.forEach(i=>G.props[i].owner=to.id);
    while(p.cards.length)to.cards.push(p.cards.shift());
    render();announceGroups(to.id,props);
    await receiveMortgaged(to,props.filter(i=>G.props[i].mort));
  }else{
    p.money=0;while(p.cards.length){const d=p.cards.shift();G.decks[d].push(GOOJF[d])}
    props.forEach(i=>{G.props[i].owner=null;G.props[i].mort=false});render();
    for(const i of props)if(active().length>1)await auction(i);
  }
  if(isImp()&&!G.over&&(p===G.players[0]||p.boss)){G.over=true;RUN++;clearSave();render();impFinish(p.boss);return}
  await sleep(1200);render();
}

async function auction(i){
  const sq=BOARD[i],n=G.players.length,order=[];
  for(let k=0;k<n;k++){const q=G.players[(G.turn+k)%n];if(!q.out)order.push(q)}
  if(!order.length)return;
  const lim={};order.forEach(q=>{if(q.bot){const pe=q.pers;lim[q.id]=Math.min(botValue(q,i)*pe.bid*(.92+Math.random()*.16),q.money-Math.min(pe.reserve*.5,150))}});
  const hum=order.find(q=>!q.bot);
  let high=0,leader=null,ui=null;const passed=new Set();
  log(`Se subasta ${pn(i)} (valor ${fmt(sq.price)})`,'','gavel');
  if(hum){
    const m=modal({title:'Subasta: '+sq.name,cls:'wide',help:'subasta'});
    m.body.innerHTML=`<div class="split">${deedHTML(i)}<div class="side"><div><div class="fl">Puja más alta</div><div class="abid" data-x="bid">Sin pujas</div><div class="alead" data-x="lead" style="margin-top:6px">Puja la cantidad que quieras. Se vende a quien más ofrezca.</div></div><div data-x="pl"></div><div class="note" data-x="note"></div></div></div>`;
    const q$=x=>m.body.querySelector(`[data-x="${x}"]`)||{};
    ui={m,q$,upd(turn){
      q$('bid').textContent=high?fmt(high):'Sin pujas';
      q$('lead').innerHTML=leader?`Va ganando ${nm(leader)}`:'Nadie ha pujado todavía.';
      q$('pl').innerHTML=order.map(q=>`<div class="apl${passed.has(q.id)?' passed':''}${q===turn?' turn':''}">${disc(q,'sm')}<span class="an">${esc(q.name)}${q===leader?' · gana':''}${passed.has(q.id)?' · se retira':''}</span><span class="am">${fmt(q.money)}</span></div>`).join('');
    }};
  }
  let k=0,guard=0;
  while(guard++<2000){
    const rem=order.filter(q=>!passed.has(q.id));
    if(!rem.length||(rem.length===1&&leader===rem[0]))break;
    const q=order[k%order.length];k++;
    if(passed.has(q.id)||q===leader)continue;
    if(ui){ui.upd(q);ui.m.acts.innerHTML=''}
    let bid=0;
    if(q.bot){
      if(ui)ui.m.acts.innerHTML=`<span class="thinking">${esc(q.name)} está pensando <span class="dots"><i></i><i></i><i></i></span></span>`;
      await sleep(ui?950:150);
      const l=lim[q.id],inc=high<100?10:high<300?10+10*rnd(2):20+10*rnd(3);
      bid=high+inc;if(bid>l)bid=Math.floor(l)>high?Math.floor(l):0;
    }else{
      bid=await new Promise(res=>{[1,10,50,100].forEach(x=>ui.m.btn(`+${x} € · ${fmt(high+x)}`,'',()=>res(high+x),high+x>q.money));ui.m.btn('Retirarme','red',()=>res(0))});
    }
    if(bid>high&&bid<=q.money){high=bid;leader=q;Snd.tick();if(ui)ui.q$('note').innerHTML=`${nm(q)} puja ${fmt(bid)}`}
    else{passed.add(q.id);if(ui)ui.q$('note').innerHTML=`${nm(q)} se retira`}
  }
  if(ui){ui.upd(null);ui.m.acts.innerHTML=`<span class="note">${leader?`<b>${esc(leader.name)}</b> gana la subasta por <b>${fmt(high)}</b>.`:'Nadie ha pujado. La propiedad sigue en el banco.'}</span>`;await wait(1700*Math.max(.6,CFG.speed));ui.m.close()}
  if(leader){addMoney(leader,-high);G.props[i].owner=leader.id;if(!leader.bot)track('buys');log(`${nm(leader)} gana la subasta de ${pn(i)} por ${fmt(high)}`,'buy','gavel');Snd.buy();announceGroups(leader.id,[i])}
  else log(`Nadie puja por ${pn(i)}. Sigue en el banco.`,'','gavel');
  render();
}

async function stepBy(p,steps){

async function land(p,dice,mode){
  const i=p.pos,sq=BOARD[i];
  await sleep(350);
  if(ownable(i)){
    const st=G.props[i];
    if(st.owner==null)await offerBuy(p,i);
    else if(st.owner===p.id)log(`${nm(p)} cae en su propia propiedad, ${pn(i)}`);
    else if(st.mort)log(`${nm(p)} cae en ${pn(i)}, que está hipotecada: no paga alquiler`);
    else{
      const ow=P(st.owner);let rent;
      if(sq.type==='util'&&mode==='util10'){const d=await rollDice(p);rent=10*d.total}else rent=rentOf(i,dice,mode);
      if(await pay(p,rent,ow,'alquiler de '+sq.name)&&(ow.bot||trackStreet(i,rent)||true))log(`${nm(p)} paga ${fmt(rent)} de alquiler a ${nm(ow)} por ${pn(i)}`,'bad');
      await sleep(500);
    }
  }else switch(sq.type){
    case 'tax':if(await pay(p,sq.amount,null,sq.name))log(`${nm(p)} paga ${fmt(sq.amount)} de ${sq.name.toLowerCase()}`,'bad');await sleep(400);break;
    case 'chance':case 'chest':await drawCard(p,sq.type);break;
    case 'gotojail':await toJail(p);break;
    case 'parking':if(isImp()&&G.imp.ev&&G.imp.ev.id==='loteria'){addMoney(p,300);log(`${nm(p)} gana la lotería del parking: 300 €`,'good');Snd.cash()}else log(`${nm(p)} descansa en el Parking gratuito`);break;
    case 'jail':log(`${nm(p)} está de visita en la cárcel`);break;
  }
  render();
}
async function offerBuy(p,i){
  const sq=BOARD[i];let buy;
  if(p.bot){say(`${nm(p)} se lo piensa: ¿comprar ${pn(i)} por ${fmt(sq.price)}?`,'deed');await sleep(1000);buy=botWantsBuy(p,i)}
  else buy=await humanBuy(p,i);
  if(buy&&p.money>=sq.price){
    addMoney(p,-sq.price);G.props[i].owner=p.id;
    if(!p.bot)track('buys');
    log(`${nm(p)} compra ${pn(i)} por ${fmt(sq.price)}`,'buy');Snd.buy();render();announceGroups(p.id,[i]);await sleep(500);
  }else{log(`${nm(p)} no compra ${pn(i)}: va a subasta`,'','gavel');await sleep(400);await auction(i)}
}
function humanBuy(p,i){
  return new Promise(res=>{
    const sq=BOARD[i],m=modal({title:'¿Compras '+sq.name+'?',help:'comprar',cls:'wide'});
    const draw=()=>{
      const grp=GROUPS[sq.group],mine=grp.idx.filter(j=>G.props[j].owner===p.id).length;
      m.body.innerHTML=`<div class="split">${deedHTML(i)}<div class="side"><div class="kv"><span>Precio</span><b>${fmt(sq.price)}</b></div><div class="kv"><span>Tu dinero</span><b>${fmt(p.money)}</b></div><div class="kv"><span>Te quedaría</span><b>${fmt(p.money-sq.price)}</b></div><div class="kv"><span>Del grupo ${grp.n} tienes</span><b>${mine} de ${grp.idx.length}</b></div><p class="note">Si no la compras, se subasta entre todos los jugadores, y tú también puedes pujar.</p></div></div>`;

async function showCard(p,deck,card){
  Snd.card();
  const html=`<div class="gcard ${deck}"><div class="t">${deck==='chance'?'SUERTE':'CAJA DE COMUNIDAD'}</div><div class="sym">${deck==='chance'?'<span class="q">?</span>':'<svg><use href="#i-chest"/></svg>'}</div><p>${card.t}</p><div class="whoc">${disc(p,'sm')}${esc(p.name)}</div></div>`;
  if(!p.bot){await ask('',html,[{label:'Continuar',cls:'pri',v:1}],{help:'cartas'});return}
  const m=modal({html});
  let done=false;m.btn('Continuar','',()=>{done=true;m.close()});
  const r=RUN;
  await new Promise(res=>{const t0=Date.now(),tick=()=>{if(r!==RUN)return;if(done||(!PAUSED&&Date.now()-t0>3200*CFG.speed)){res();return}setTimeout(tick,100)};tick()});
  m.close();
}
async function drawCard(p,deck){
  const id=G.decks[deck].shift(),card=fixCard(DECKS[deck][id]);
  if(card.a.type!=='goojf')G.decks[deck].push(id);
  log(`${nm(p)} roba ${deck==='chance'?'Suerte':'Caja de Comunidad'}: «${card.t}»`,'','card');
  await showCard(p,deck,card);
  const a=card.a;
  switch(a.type){
    case 'move':await advanceTo(p,a.to);await land(p,G.lastDice);break;
    case 'nearRail':{const t=[5,15,25,35].find(x=>x>p.pos)??5;await advanceTo(p,t);await land(p,G.lastDice,'rail2');break}
    case 'nearUtil':{const t=[12,28].find(x=>x>p.pos)??12;await advanceTo(p,t);await land(p,G.lastDice,'util10');break}
    case 'back3':await stepBy(p,-3);await land(p,G.lastDice);break;
    case 'collect':addMoney(p,a.amt);Snd.cash();log(`${nm(p)} cobra ${fmt(a.amt)}`,'good');render();break;
    case 'pay':if(await pay(p,a.amt,null,'carta'))log(`${nm(p)} paga ${fmt(a.amt)}`,'bad');break;
    case 'goojf':p.cards.push(deck);log(`${nm(p)} guarda la carta «Libre de la cárcel»`,'free','key');render();break;
    case 'jail':await toJail(p);break;
    case 'repairs':{const{h,H}=buildingsOf(p),tot=h*a.h+H*a.H;if(tot){if(await pay(p,tot,null,'reparaciones'))log(`${nm(p)} paga ${fmt(tot)} en reparaciones`,'bad')}else log(`${nm(p)} no tiene edificios: no paga nada`);break}
    case 'payEach':for(const o of active()){if(o===p)continue;if(!await pay(p,a.amt,o,'carta'))break}if(!p.out)log(`${nm(p)} paga ${fmt(a.amt)} a cada jugador`,'bad');break;
    case 'collectEach':for(const o of active()){if(o===p)continue;await pay(o,a.amt,p,'cumpleaños de '+p.name)}log(`${nm(p)} recibe ${fmt(a.amt)} de cada jugador`,'good');break;
  }
  render();
}

/* =================== modo El Golpe =================== */
const POLICE=[4,30,38];
const GOLPE_RISK={agresivo:.42,prudente:.22,negociador:.3,equilibrado:.32,constructor:.28};
const DICE_P={2:1,3:2,4:3,5:4,6:5,7:6,8:5,9:4,10:3,11:2,12:1};
const GCARDS=[
  {t:'Caja fuerte abierta: +150 € al botín.',k:'cash',v:150,w:3},
  {t:'Un soplo: en tu próxima tirada no te pueden pillar.',k:'shield',w:2},
  {t:'Chivatazo: pierdes la mitad del dinero del botín.',k:'half',w:2},
  {t:'Coche de huida: te plantas ahora y el dinero del botín vale el doble.',k:'escape',w:1},
  {t:'Calle sin vigilancia: una calle libre al azar entra en tu botín.',k:'street',w:2},
  {t:'Comisión: cada rival aporta 50 € a tu botín.',k:'tax',v:50,w:2},
  {t:'¡Redada! La policía te pilla.',k:'raid',w:1},
  {t:'Golpe maestro: el dinero del botín se duplica.',k:'double',w:1},
];
const isGolpe=()=>G&&G.mode==='golpe';
function golpeCard(){const tot=GCARDS.reduce((s,c)=>s+c.w,0);let r=Math.random()*tot;for(const c of GCARDS){if((r-=c.w)<0)return c}return GCARDS[0]}
function isBust(p,i){if(POLICE.includes(i))return true;if(!ownable(i))return false;const st=G.props[i];return st.owner!=null&&st.owner!==p.id&&!st.mort}
function bustRisk(p){let r=0;for(const s in DICE_P){if(isBust(p,(p.pos+ +s)%40))r+=DICE_P[s]/36}return Math.min(1,r)}
const lootValue=L=>L.cash+L.props.reduce((s,i)=>s+BOARD[i].price,0);
const fullGroups=pid=>GORDER.filter(g=>GW[g]&&ownsAll(pid,g)).length;
function renderLoot(L,p){
  const box=$('#loot');if(!L){box.hidden=true;return}
  box.hidden=false;const r=bustRisk(p),pct=Math.round(r*100);
  box.innerHTML=`<div class="lt-h"><span class="lt-t">${ic('cash')}Botín de ${p.bot?esc(p.name):'tu golpe'}</span><b class="lt-v">${fmt(lootValue(L))}</b></div>
  <div class="lt-items">${L.cash?`<span class="lchip cash">${fmt(L.cash)}</span>`:''}${L.props.map(i=>`<span class="lchip" style="--cc:${gcol(i)}">${BOARD[i].name}</span>`).join('')}${!L.cash&&!L.props.length?'<span class="note" style="font-size:12.5px">Vacío. Cada tirada puede llenarlo… o vaciarlo.</span>':''}</div>
  <div class="risk"><span>Riesgo de que te pillen en la próxima tirada</span><b class="${L.shield?'lo':r>.35?'hi':r>.2?'mid':'lo'}">${L.shield?'Protegido':pct+' %'}</b><div class="rbar"><i style="width:${L.shield?0:pct}%"></i></div></div>`;
}
function bigBanner(title,sub,color){
  const b=$('#banner');
  b.innerHTML=`<div class="bx big" style="--pc:${color}"><div><small>${sub}</small><b>${title}</b></div></div>`;

}
async function showGolpeCard(p,c){
  Snd.card();
  const html=`<div class="gcard golpe"><div class="t">CARTA DE GOLPE</div><div class="sym"><svg><use href="#i-${c.k==='raid'?'shield':c.k==='shield'?'unlock':c.k==='escape'?'car':'cash'}"/></svg></div><p>${c.t}</p><div class="whoc">${disc(p,'sm')}${esc(p.name)}</div></div>`;
  if(!p.bot){await ask('',html,[{label:'Continuar',cls:'pri',v:1}],{help:'golpe'});return}
  const m=modal({html});let done=false;m.btn('Continuar','',()=>{done=true;m.close()});
  const r=RUN;await new Promise(res=>{const t0=Date.now(),tick=()=>{if(r!==RUN)return;if(done||(!PAUSED&&Date.now()-t0>2800*CFG.speed)){res();return}setTimeout(tick,100)};tick()});
  m.close();
}
async function applyGolpeCard(p,L,c){
  switch(c.k){
    case 'cash':L.cash+=c.v;Snd.cash();break;
    case 'shield':L.shield=true;break;
    case 'half':L.cash=Math.floor(L.cash/2/10)*10;break;
    case 'escape':L.cash*=2;return 'bank';
    case 'street':{const free=Object.keys(G.props).map(Number).filter(i=>G.props[i].owner==null&&G.props[i].pend==null);if(free.length){const i=free[rnd(free.length)];G.props[i].pend=p.id;L.props.push(i);log(`${pn(i)} entra en el botín de ${nm(p)}`,'buy','deed');renderBoard()}break}
    case 'tax':for(const o of active()){if(o===p)continue;const v=Math.min(c.v,o.money);addMoney(o,-v);L.cash+=v}Snd.cash();render();break;
    case 'raid':return 'bust';
    case 'double':L.cash*=2;Snd.cash();break;
  }
  return 'ok';
}
async function golpeStep(p,L,d,shielded){
  const t=tokEls[p.id];
  for(let s=0;s<d.total;s++){
    p.pos=(p.pos+1)%40;
    if(p.pos===0){L.cash+=200;log(`${nm(p)} pasa por la SALIDA: +200 € al botín`,'good');Snd.cash();renderLoot(L,p)}
    placeTokens();if(t){t.classList.remove('hop');void t.offsetWidth;t.classList.add('hop')}
    camFollowPlayer(p,320);Snd.step();await sleep(210);
  }
  flash(p.pos);await sleep(300);
  const i=p.pos,sq=BOARD[i];
  if(d.double){L.cash+=50;log(`${nm(p)} saca dobles: +50 € al botín`,'good','dice')}
  if(isBust(p,i)){
    if(shielded){log(`${nm(p)} cae en ${ownable(i)?pn(i):'un control policial'}, pero el soplo le salva`,'free','unlock');return 'ok'}
    if(POLICE.includes(i)){log(`${nm(p)} cae en un control policial`,'jail','shield');return 'bust'}
    const ow=P(G.props[i].owner),rent=rentOf(i,d.total);
    L.props.forEach(j=>{delete G.props[j].pend});L.props=[];renderBoard();
    log(`${nm(p)} cae en ${pn(i)}, de ${nm(ow)}: pierde el botín y le debe ${fmt(rent)} de alquiler`,'bad');
    if(!await pay(p,rent,ow,'alquiler de '+sq.name))return 'out';
    if(!ow.bot)trackStreet(i,rent);
    return 'bust';
  }
  if(ownable(i)){
    const st=G.props[i];
    if(st.owner==null&&st.pend==null){st.pend=p.id;L.props.push(i);log(`${nm(p)} mete ${pn(i)} en el botín`,'buy','deed');Snd.buy();renderBoard()}
    else if(st.owner===p.id){const v=Math.max(10,rentOf(i,d.total));L.cash+=v;log(`${nm(p)} cobra ${fmt(v)} de sus inquilinos en ${pn(i)}`,'good');Snd.cash()}
    else if(st.pend===p.id)log(`${nm(p)} vuelve a pasar por ${pn(i)}`);
    else log(`${pn(i)} está hipotecada: ${nm(p)} pasa sin problemas`);
  }else if(sq.type==='chance'||sq.type==='chest'){
    const c=golpeCard();log(`${nm(p)} roba una carta de golpe: «${c.t}»`,'','card');
    await showGolpeCard(p,c);return applyGolpeCard(p,L,c);
  }else if(sq.type==='parking'){L.cash+=100;log(`${nm(p)} encuentra 100 € en el parking`,'good');Snd.cash()}
  else if(sq.type==='jail')log(`${nm(p)} pasa por delante de la cárcel sin que le vean`);
  return 'ok';
}
async function bustLoot(p,L){
  const lost=lootValue(L);
  L.props.forEach(i=>{delete G.props[i].pend});
  if(POLICE.includes(p.pos)){p.pos=10;p.jail=true;placeTokens();camFollowPlayer(p,600);Snd.jail()}else Snd.bust();
  vib([40,50,40]);
  bigBanner('¡Pillado!',lost?`${esc(p.name)} pierde un botín de ${fmt(lost)}`:`${esc(p.name)} se queda sin nada`,'#e8604c');
  log(`${nm(p)} pierde el botín${lost?' de '+fmt(lost):''}`,'bad','down');
  renderLoot(L,p);render();await sleep(1500);
}
async function bankLoot(p,L){
  const v=lootValue(L);
  addMoney(p,L.cash);
  L.props.forEach(i=>{const st=G.props[i];delete st.pend;st.owner=p.id});
  Snd.win();vib(25);
  bigBanner(v?`+${fmt(v)}`:'Sin botín',v?`${esc(p.name)} pone a salvo su golpe${L.props.length?` y ${L.props.length} ${L.props.length>1?'calles':'calle'}`:''}`:`${esc(p.name)} se planta`,'#5fd197');
  log(`${nm(p)} se planta y guarda ${fmt(L.cash)}${L.props.length?' y '+L.props.map(pn).join(', '):''}`,'big','lock');
  render();announceGroups(p.id,L.props);
  await sleep(1500);
}
function golpeChoice(p,L){
  return new Promise(res=>{
    const acts=$('#actions');acts.innerHTML='';
    const r=bustRisk(p),v=lootValue(L);
    const b=el('button','btn grn mid',ic('lock')+`Plantarme · ${fmt(v)}`);b.type='button';b.onclick=()=>{acts.innerHTML='';res(false)};
    const a=el('button','btn pri pulse',ic('dice')+'Tirar otra vez');a.type='button';a.onclick=()=>{acts.innerHTML='';res(true)};
    const h=el('button','hq',ic('help'));h.type='button';h.setAttribute('aria-label','Cómo funciona El Golpe');h.onclick=()=>openHelp('golpe');h.style.alignSelf='center';
    acts.append(b,a,h);
    say(L.shield?'Tienes el soplo: en la próxima tirada no te pueden pillar.':`Hay un ${Math.round(r*100)} % de que te pillen en la próxima tirada. ¿Sigues o te plantas?`);
  });
}
function botGolpeGo(p,L){
  const v=lootValue(L);if(!v||L.shield)return true;
  const t=(GOLPE_RISK[p.pers.arch]||.3)*(.85+Math.random()*.3);
  return bustRisk(p)<t/(1+v/700);
}
async function playTurnGolpe(p){
  p.jail=false;render();
  const L={cash:0,props:[],shield:false};G.loot=L;
  if(p.bot){showBotTurn(p);await sleep(500)}else await humanAction(p,'roll');
  while(!G.over){
    renderLoot(L,p);
    if(p.bot)showBotTurn(p);else $('#actions').innerHTML='';
    const d=await rollDice(p),sh=L.shield;L.shield=false;
    const res=await golpeStep(p,L,d,sh);
    renderLoot(L,p);
    if(res==='out'){L.cash=0;L.props=[];break}
    if(res==='bust'){await bustLoot(p,L);break}
    if(res==='bank'){await bankLoot(p,L);break}
    let go;
    if(p.bot){say(`${nm(p)} se lo piensa: ${fmt(lootValue(L))} en juego`);await sleep(1100);go=botGolpeGo(p,L);if(go)log(`${nm(p)} se arriesga y tira otra vez`,'','dice')}
    else go=await golpeChoice(p,L);
    if(!go){await bankLoot(p,L);break}
  }
  G.loot=null;renderLoot(null);render();
  if(!p.out)await endPhase(p);
}

function houseCost(g,pid){

    if(G.imp.ev&&G.imp.ev.id==='boom')c*=.5;
    const p=P(pid);
    if(p.boss&&G.imp.power.t==='build')c*=1-G.imp.power.v;
    if(!p.bot){c*=1-.1*skill('con');if(hasBiz('agencia'))c*=.9}
  }
  return Math.max(5,Math.round(c/5)*5);
}
function impRent(i,r){
  if(!r)return r;const sq=BOARD[i],st=G.props[i],ev=G.imp.ev;
  if(ev){if(ev.id==='crisis')r*=.75;if(ev.id==='fiestas'&&sq.group===ev.g)r*=2;if(ev.id==='turismo'&&sq.type==='rail')r*=2;if(ev.id==='huelga'&&sq.type==='rail')r=0}
  if(st.owner!=null&&P(st.owner).boss&&G.imp.power.t==='rent')r*=1+G.imp.power.v;
  return Math.round(r);
}
function goSalary(p){
  let s=200;
  if(isImp()){
    if(!p.bot)s+=25*skill('inv');
    if(p.boss&&G.imp.power.t==='go')s+=G.imp.power.v;
    if(G.imp.ev&&G.imp.ev.id==='paga')s+=100;
  }

}

}
const debtLimit=()=>Math.round((3000+300*(G.imp.zi%ZONES.length)+500*G.imp.tier)*(hasBiz('banco')?1.5:1));

function recordMatch(mode,win){
  if(!G||G.recorded)return;G.recorded=true;
  const st=PROF.stats,t=G.track||{rentIn:0,streets:{}};
  st.played++;if(win)st.wins++;st.modes[mode].p++;if(win)st.modes[mode].w++;
  st.rentIn+=t.rentIn||0;st.bestNW=Math.max(st.bestNW,netWorth(G.players[0]));
  for(const n in t.streets||{})st.streets[n]=(st.streets[n]||0)+t.streets[n];

  checkAch(true);saveProf();
}
