}

/* --- partida de Imperio --- */
function newImperioGame(zi){
  const z=zoneOf(zi),tier=tierOf(zi),lv=zi%ZONES.length;
  applyZone(z);
  const g=newGame(PROF.name||'Tú',PROF.token||'hat','imperio');
  g.imp={zi,zid:z.id,tier,power:z.boss.power,ev:null,evRound:0,nextEv:4,debt:0,loanUsed:false,mortUsed:false,maxRails:0};
  g.track={rentIn:0,buys:0,builds:0,streets:{}};
  const boss=g.players[1];boss.name=z.boss.name;boss.boss=true;boss.pers=makePers(['agresivo','constructor','equilibrado'][lv%3]);
  g.players.forEach(p=>{
    if(p.bot)p.money=1500+150*lv+300*tier+(p.boss?400:0);
    else p.money=1500+Math.min(800,Math.round(PROF.capital*.05/10)*10)+(hasBiz('naviera')?300:0);
  });
  if(z.boss.power.t==='cash')boss.money+=z.boss.power.v;
  if(z.boss.power.t==='props'){
    let n=0;for(const i of shuffle(STREET_IDX.slice())){if(n>=z.boss.power.v)break;const gi=GROUPS[BOARD[i].group].idx;if(gi.filter(j=>g.props[j].owner===1).length>=gi.length-1)continue;g.props[i].owner=1;n++}
  }
  return g;
}
function starResults(win){
  const z=zoneOf(G.imp.zi),h=G.players[0],s=z.star;
  let third=false;
  if(win){
    if(s.t==='nomort')third=!G.imp.mortUsed;
    if(s.t==='noloan')third=!G.imp.loanUsed;
    if(s.t==='hotels2')third=propsOf(0).filter(i=>G.props[i].houses===5).length>=2;
    if(s.t==='rails4')third=G.imp.maxRails>=4||ownsAll(0,'rail');
    if(s.t==='groups3')third=GORDER.filter(g=>GW[g]&&ownsAll(0,g)).length>=3;
    if(s.t==='rich')third=netWorth(h)>=s.v;
  }
  return[win,win&&G.round<=30,third];
}
function impFinish(win){
  const zi=G.imp.zi,z=zoneOf(zi),zs=zoneState(zi),h=G.players[0];
  zs.tries++;
  const got=starResults(win),newStars=got.filter((v,k)=>v&&!zs.stars[k]).length;
  zs.stars=zs.stars.map((v,k)=>v||got[k]);
  const t=G.track||{};
  const xp=(win?250:70)+80*newStars+6*(t.buys||0)+10*(t.builds||0)+Math.floor((t.rentIn||0)/25);
  const nw=Math.max(netWorth(h),(G.track&&G.track.maxNW)||0),cap=Math.max(win?100:50,Math.round((win?nw*.25:nw*.08)/10)*10);
  let lifeMsg='',lostCap=0;
  if(win){zs.wins++;PROF.stats.bosses++;if(zi===PROF.progress)PROF.progress++;if(!G.imp.loanUsed)PROF.ach.sinprestamos=PROF.ach.sinprestamos||Date.now()}
  else{zs.lives--;if(zs.lives<=0){zs.lives=3;lostCap=Math.round(PROF.capital*.25/10)*10;PROF.capital-=lostCap;lifeMsg=`Has perdido las 3 vidas de la zona: el banco se queda con ${fmt(lostCap)} de tu capital y las vidas se recargan.`}else lifeMsg=`Pierdes una vida. Te quedan ${zs.lives} en esta zona.`}
  PROF.capital+=cap;
  recordMatch('imperio',win);
  const ups=addXP(xp);
  const achs=checkAch(true);
  saveProf();
  Snd[win?'win':'bust']();

const dailyReady=()=>PROF.daily.last!==today();
function claimDaily(){

  PROF.daily.max=Math.max(PROF.daily.max,PROF.daily.streak);PROF.daily.last=today();
  const cap=100+50*Math.min(PROF.daily.streak-1,6);PROF.capital+=cap;
  const ups=addXP(30);checkAch(true);saveProf();Snd.win();
  ask('Recompensa diaria',`<p class="lead">Día <b>${PROF.daily.streak}</b> seguido. Recibes <b class="gold">${fmt(cap)}</b> de capital y 30 XP${ups?` y subes al nivel ${PROF.level}`:''}.</p><p class="note" style="margin-top:10px">Vuelve mañana: cuantos más días seguidos, mayor es el premio (hasta 400 € al día).</p>`,[{label:'Genial',cls:'pri',v:1}]).then(openHub);

/* =================== turnos =================== */
function humanAction(p,mode){
  return new Promise(res=>{
    const acts=$('#actions');acts.innerHTML='';
    const add=(label,c,fn,title)=>{const b=el('button','btn '+c,label);b.type='button';if(title){b.title=title;b.setAttribute('aria-label',title)}b.onclick=fn;acts.appendChild(b);return b};
    const done=v=>{acts.innerHTML='';res(v)};
    const props=()=>add(ic('deed'),'sq2',()=>openManage(p),'Tus propiedades');
    const trade=()=>add(ic('swap'),'sq2',()=>openTrade(p),'Negociar');
    if(mode==='roll'){props();add(ic('dice')+(G.doublesNow?'Tirar otra vez':'Tirar dados'),'pri pulse',()=>done('roll'));trade();say(G.doublesNow?'Has sacado dobles: vuelve a tirar.':'Te toca. Antes de tirar puedes gestionar tus propiedades o negociar.')}
    if(mode==='end'){props();add(ic('check')+'Terminar turno','pri',()=>done('end'));trade();say('Puedes construir, hipotecar o negociar antes de terminar tu turno.')}
    if(mode==='jail'){
      add(ic('dice')+`Intentar dobles (${p.jailTurns+1} de 3)`,'pri',()=>done('roll'));
      add('Pagar 50 €','mid',()=>done('pay'));
      if(p.cards.length)add(ic('key')+'Usar carta','mid',()=>done('card'));
      props();trade();
      say('Estás en la cárcel. Paga 50 €, usa una carta o intenta sacar dobles.');
    }
  });
}
function showBotTurn(p){$('#actions').innerHTML=`<div class="thinking">${disc(p,'sm')}Juega ${esc(p.name)} <span class="dots"><i></i><i></i><i></i></span></div>`}
function turnBanner(p){
  const b=$('#banner');
  b.innerHTML=`<div class="bx" style="--pc:${p.color}">${disc(p,'xl')}<div><small>Ronda ${G.round}</small><b>${p.bot?'Turno de '+esc(p.name):'Tu turno'}</b></div></div>`;
  b.classList.remove('show');void b.offsetWidth;b.classList.add('show');
}
async function jailPhase(p){
  if(p.bot){say(`${nm(p)} está en la cárcel y decide qué hacer`);await sleep(1100)}
  const ch=p.bot?botJailChoice(p):await humanAction(p,'jail');
  if(ch==='card'&&p.cards.length){const d=p.cards.shift();G.decks[d].push(GOOJF[d]);p.jail=false;log(`${nm(p)} usa la carta y sale de la cárcel`,'free');render();await sleep(600);return 'free'}
  if(ch==='pay'){if(!await pay(p,50,null,'salir de la cárcel'))return 'done';p.jail=false;log(`${nm(p)} paga 50 € y sale de la cárcel`,'free');render();await sleep(600);return 'free'}
  if(p.bot)showBotTurn(p);else $('#actions').innerHTML='';
  const d=await rollDice(p);
  if(d.double){p.jail=false;log(`${nm(p)} saca dobles y sale de la cárcel`,'free');await stepBy(p,d.total);await land(p,d.total);return 'done'}
  p.jailTurns++;
  if(p.jailTurns>=3){
    log(`${nm(p)} falla el tercer intento: paga 50 € y sale`,'jail');
    if(!await pay(p,50,null,'salir de la cárcel'))return 'done';
    p.jail=false;render();await stepBy(p,d.total);await land(p,d.total);return 'done';
  }
  log(`${nm(p)} no saca dobles y sigue en la cárcel`,'jail');render();await sleep(500);
  return 'done';
}
async function playTurn(p){
  G.doublesNow=false;render();logTurn(p);
  if(CAM.mode==='free')CAM.mode=CAM.pref;
  camRefresh(800);turnBanner(p);Snd.turn();
  if(G.mode==='imperio')await impTurnStart(p);
  if(G.mode==='golpe'){if(p.bot)say(`Turno de ${nm(p)}`);await sleep(p.bot?1100:500);await playTurnGolpe(p);return}
  if(p.bot){showBotTurn(p);say(`Turno de ${nm(p)}`);await sleep(1200)}else{vib(15);$('#actions').innerHTML='';await wait(650)}
  if(p.jail){const r=await jailPhase(p);if(r==='done'){if(!p.out)await endPhase(p);return}}
  let doubles=0;
  while(!p.out){
    if(p.bot){showBotTurn(p);await sleep(450)}else await humanAction(p,'roll');
    if(p.bot)showBotTurn(p);else $('#actions').innerHTML='';
    const d=await rollDice(p);
    if(d.double){doubles++;if(doubles===3){log(`${nm(p)} saca dobles tres veces seguidas`,'jail');await toJail(p);break}}
    await stepBy(p,d.total);
    await land(p,d.total);
    if(p.out||p.jail||!d.double)break;
    G.doublesNow=true;log(`${nm(p)} ha sacado dobles: vuelve a tirar`,'','dice');
    if(p.bot)await sleep(700);
  }
  G.doublesNow=false;
  if(!p.out)await endPhase(p);
}
async function endPhase(p){
  if(p.bot){showBotTurn(p);await botManage(p);await sleep(900)}
  else{try{G.pendingEnd=true;save()}finally{delete G.pendingEnd}await humanAction(p,'end')}
}
function nextTurn(){let n=G.turn;do{n=(n+1)%G.players.length;if(n===G.firstTurn)G.round++}while(G.players[n].out);G.turn=n}
async function checkEnd(){
  const act=active();
  if(G.mode==='imperio'){const h=G.players[0],boss=G.players.find(p=>p.boss);if(h.out){G.over=true;clearSave();render();impFinish(false);return true}if((boss&&boss.out)||act.length===1){G.over=true;clearSave();render();impFinish(true);return true}return false}

  if(act.length<=1){G.over=true;clearSave();render();showWinner(act[0]);return true}
  const h=G.players[0];
  if(h.out&&!G.humanOutShown){
    G.humanOutShown=true;recordMatch(G.mode,false);
    const v=await ask('Has quebrado','<p class="lead">Te has quedado sin dinero. Puedes ver cómo terminan la partida tus rivales o empezar una nueva.</p>',[{label:'Nueva partida',v:'new'},{label:'Ver el final',cls:'pri',v:'watch'}]);
    if(v==='new'){clearSave();goStart();return true}
    CFG.speed=.5;updSpeed();
  }
  return false;
}
function showWinner(w){
  recordMatch(G.mode,!!(w&&!w.bot));
  Snd.win();vib([40,60,40,60,80]);
  const rest=G.players.filter(p=>p!==w).sort((a,b)=>(b.outOrder||0)-(a.outOrder||0));
  const isMe=w&&!w.bot;
  const list=[w,...rest].filter(Boolean).map((p,k)=>`<div><span class="pos">${k+1}</span>${disc(p)}<div style="flex:1;min-width:0"><b>${esc(p.name)}</b><small>${p.bot?ARCH[p.pers.arch].d:'Tú'}</small></div><span class="note">${k===0?fmt(netWorth(p)):'Quiebra'}</span></div>`).join('');
  const m=modal({title:isMe?'Has ganado la partida':`Gana ${esc(w?w.name:'nadie')}`,html:`<p class="lead">${isMe?'Has llevado a la quiebra a todos tus rivales. Eres el gran magnate de Barcelona.':'La partida ha terminado.'} Ha durado ${G.round} rondas.</p><div class="fl" style="margin-top:16px">Clasificación y estilos de juego</div><div class="rank">${list}</div>`});
  m.md.querySelector('.mh').insertAdjacentHTML('afterbegin',`<svg class="ic" style="width:32px;height:32px;color:var(--brass)"><use href="#i-trophy"/></svg>`);
  m.btn('Nueva partida','pri',()=>{m.close();goStart()});
}
async function decideOrder(){
  render();say('Cada jugador tira los dados. Empieza quien saque el número más alto.');
  const m=modal({title:'¿Quién empieza?',help:'orden'});
  m.body.innerHTML=`<p class="lead">Todos tiran los dos dados. Empieza quien saque el número más alto; si hay empate, los empatados vuelven a tirar.</p><div class="olist">${G.players.map(p=>`<div class="orow" data-o="${p.id}">${disc(p)}<span class="on2">${esc(p.name)}${p.bot?'':' <span class="you">Tú</span>'}</span><span class="odice"><span class="die sm"></span><span class="die sm"></span></span><span class="otot">–</span></div>`).join('')}</div><p class="note" data-x="msg" style="margin-top:12px"></p>`;
  m.body.querySelectorAll('.die').forEach(d=>setDie(d,1));
  const row=p=>m.body.querySelector(`[data-o="${p.id}"]`);
  let cands=G.players.slice();
  while(true){
    const res={};
    for(const p of cands){
      const r=row(p);r.classList.add('active');
      if(!p.bot)await new Promise(ok=>{const b=m.btn(ic('dice')+'Tirar mis dados','pri',()=>{m.acts.innerHTML='';ok()});setTimeout(()=>b.focus(),50)});
      else await sleep(700);
      const a=1+rnd(6),b=1+rnd(6),ds=r.querySelectorAll('.die');Snd.dice();
      ds.forEach(d=>d.classList.add('roll'));
      for(let f=0;f<8;f++){setDie(ds[0],1+rnd(6));setDie(ds[1],1+rnd(6));await wait(65)}
      ds.forEach(d=>d.classList.remove('roll'));setDie(ds[0],a);setDie(ds[1],b);
      r.querySelector('.otot').textContent=a+b;res[p.id]=a+b;r.classList.remove('active');
      await sleep(400);
    }
    const max=Math.max(...cands.map(p=>res[p.id])),top=cands.filter(p=>res[p.id]===max);
    cands.filter(p=>res[p.id]!==max).forEach(p=>row(p).classList.add('lose'));
    if(top.length===1){
      const w=top[0];row(w).classList.add('win');
      m.body.querySelector('[data-x="msg"]').innerHTML=`${nm(w)} saca ${max}, el número más alto, y empieza la partida. Después se juega en el orden de la lista.`;
      await new Promise(ok=>{const b=m.btn('Empezar','pri',()=>{m.close();ok()});setTimeout(()=>b.focus(),50)});
      return w.id;
    }
    m.body.querySelector('[data-x="msg"]').innerHTML=`Empate a ${max} entre ${top.map(nm).join(' y ')}: vuelven a tirar.`;
    await sleep(1400);
    top.forEach(p=>{const r=row(p);r.querySelector('.otot').textContent='–';r.querySelectorAll('.die').forEach(d=>setDie(d,1))});
    cands=top;
  }
}
async function gameLoop(){
  const run=RUN;
  if(!G.started){
    const first=await decideOrder();if(run!==RUN)return;
    G.turn=first;G.firstTurn=first;G.started=true;
    log(`${nm(P(first))} saca el número más alto y empieza la partida`,'big','flag');
  }
  if(G.pendingEnd){delete G.pendingEnd;if(!await checkEnd())nextTurn();else return}
  while(run===RUN&&!G.over){
    const p=G.players[G.turn];
    if(!p.out){save();render();await playTurn(p)}
    if(run!==RUN)return;
    if(await checkEnd())return;
    nextTurn();save();
  }
}

const CAM={x:0,y:0,s:.3,vw:300,vh:300,mode:'follow',pref:'follow',init:false};
const WIDE=matchMedia('(min-width:1000px) and (min-aspect-ratio:5/4)');
const FRAME=36;
const overS=()=>Math.min(CAM.vw,CAM.vh)*.96/(BASE+FRAME);
const followS=()=>Math.max(overS()*1.45,Math.min(Math.min(CAM.vw,CAM.vh)/(L.c*(WIDE.matches?7.2:5.3)),1.15));
const maxS=()=>Math.max(1.8,followS()*1.4);
function camApply(ms){const b=$('#board');b.style.transition=ms?`transform ${ms}ms cubic-bezier(.25,.8,.3,1)`:'none';b.style.transform=`translate(${CAM.x}px,${CAM.y}px) scale(${CAM.s})`}
function camClamp(){
  const W=BASE*CAM.s,m=FRAME;
  CAM.x=W<=CAM.vw?(CAM.vw-W)/2:Math.min(m,Math.max(CAM.vw-W-m,CAM.x));
  CAM.y=W<=CAM.vh?(CAM.vh-W)/2:Math.min(m,Math.max(CAM.vh-W-m,CAM.y));
}
function camTo(bx,by,s,ms){CAM.s=s;CAM.x=CAM.vw/2-bx*s;CAM.y=CAM.vh/2-by*s;camClamp();camApply(ms)}
function camOverview(ms=600){CAM.s=overS();camClamp();camApply(ms)}
function camFollowPlayer(p,ms=500){if(!p||!G||CAM.mode!=='follow')return;const q=tokenPos(p);camTo(q.x,q.y,followS(),ms)}
function camRefresh(ms=0){
  if(!G||!G.started||CAM.mode==='overview')camOverview(ms);
  else if(CAM.mode==='follow')camFollowPlayer(P(G.turn),ms);
  else{camClamp();camApply(ms)}
  updCamBtns();
}
function setCamMode(m){CAM.mode=m;CAM.pref=m;CFG.cam=m;saveCfg();camRefresh(650)}
function updCamBtns(){$('#cFollow').classList.toggle('on',CAM.mode==='follow');$('#cAll').classList.toggle('on',CAM.mode==='overview')}
function camZoom(f,cx=CAM.vw/2,cy=CAM.vh/2,ms=260){
  const s=Math.min(maxS(),Math.max(overS()*.9,CAM.s*f)),bx=(cx-CAM.x)/CAM.s,by=(cy-CAM.y)/CAM.s;
  CAM.s=s;CAM.x=cx-bx*s;CAM.y=cy-by*s;CAM.mode='free';camClamp();camApply(ms);updCamBtns();
}
let camMovedFlag=false;const camMoved=()=>camMovedFlag;
(function(){
  const cam=$('#cam'),ptr=new Map();let st=null;
  const rel=e=>{const r=$('#stage').getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  const startPan=p=>{st={type:'pan',sx:p.x,sy:p.y,x0:CAM.x,y0:CAM.y}};
  cam.addEventListener('pointerdown',e=>{
    if(e.button>0)return;
    ptr.set(e.pointerId,rel(e));
    if(ptr.size===1){camMovedFlag=false;startPan(rel(e))}
    else if(ptr.size===2){const[a,b]=[...ptr.values()];st={type:'pinch',d0:Math.max(20,Math.hypot(a.x-b.x,a.y-b.y)),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,s0:CAM.s,x0:CAM.x,y0:CAM.y}}
  });
  window.addEventListener('pointermove',e=>{
    if(!ptr.has(e.pointerId)||!st)return;ptr.set(e.pointerId,rel(e));
    if(st.type==='pan'&&ptr.size===1){
      const p=rel(e),dx=p.x-st.sx,dy=p.y-st.sy;
      if(!camMovedFlag&&Math.hypot(dx,dy)<8)return;
      camMovedFlag=true;cam.classList.add('drag');CAM.mode='free';CAM.x=st.x0+dx;CAM.y=st.y0+dy;camClamp();camApply(0);updCamBtns();
    }else if(st.type==='pinch'&&ptr.size>=2){
      const[a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      const s=Math.min(maxS(),Math.max(overS()*.9,st.s0*d/st.d0)),bx=(st.mx-st.x0)/st.s0,by=(st.my-st.y0)/st.s0;
      CAM.s=s;CAM.x=mx-bx*s;CAM.y=my-by*s;camMovedFlag=true;CAM.mode='free';camClamp();camApply(0);updCamBtns();
    }
  });
  const up=e=>{if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);cam.classList.remove('drag');if(ptr.size===1)startPan([...ptr.values()][0]);else if(!ptr.size)st=null};
  window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);

const KEYS=()=>[PROF_KEY,CFG_KEY,saveKey('clasico'),saveKey('golpe'),saveKey('imperio')];
async function hydrate(){
  let changed=false;
  for(const k of KEYS()){
    const cur=kvGet(k),a=await idbGet(k),b=await cacheGet(k);
    const c=[cur,a,b].filter(v=>typeof v==='string'&&v);
    if(!c.length)continue;
    const best=c.reduce((x,y)=>tsOf(y)>tsOf(x)?y:x);
    if(best!==cur){MEM[k]=best;try{localStorage.setItem(k,best)}catch(e){}changed=true}
    if(a!==best)idbSet(k,best);if(b!==best)cacheSet(k,best);
  }
  HYDRATED=true;
  return changed;
}
let HEALTH={ls:false,idb:false,cache:false,persist:null};
async function storageHealth(){
  const h={ls:false,idb:false,cache:false,persist:null};
  try{localStorage.setItem('__magnate_t','1');h.ls=localStorage.getItem('__magnate_t')==='1';localStorage.removeItem('__magnate_t')}catch(e){}
  h.idb=!!(await idbOpen())&&await idbSet('__t',1);
  try{if(window.caches){await caches.open('magnate-datos');h.cache=true}}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist){h.persist=await navigator.storage.persisted();if(!h.persist)h.persist=await navigator.storage.persist()}}catch(e){}
  HEALTH=h;return h;
}
const storageOk=()=>HEALTH.ls||HEALTH.idb;
async function exportData(){
  const data={app:'magnate',v:1,at:Date.now(),keys:{}};
  for(const k of KEYS()){const v=kvGet(k);if(v)data.keys[k]=v}
  const txt=JSON.stringify(data),name=`magnate-copia-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([txt],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Copia de Magnate'});return true}}catch(e){if(e&&e.name==='AbortError')return false}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true}catch(e){return false}
}
function importData(text){
  const d=JSON.parse(text);if(!d||d.app!=='magnate'||!d.keys)throw new Error('formato');
  HYDRATED=true;
  for(const k in d.keys){const v=d.keys[k];let o=null;try{o=JSON.parse(v)}catch(e){}if(o&&typeof o==='object'){o._ts=Date.now();kvSet(k,JSON.stringify(o))}}

  const liveTxt=sv=>`Ronda ${sv.round} · ${fmt(sv.players[0].money)}`;
  const two=(m)=>`<button class="btn white" type="button" data-act="cont" data-m="${m}">${ic('play')}Continuar</button><button class="btn glass" type="button" data-act="new" data-m="${m}">Nueva</button>`;
  const one=(m,l)=>`<button class="btn white" type="button" data-act="new" data-m="${m}">${ic('play')}${l}</button>`;
  const zonesDone=Object.values(PROF.zones).filter(z=>z.wins>0).length;
  const warn=HYDRATED&&!storageOk()?`<div class="daily" style="border-color:var(--bad);background:linear-gradient(120deg,#3d1d1d,#1d2b38);animation:none" id="stWarn">${ic('x')}<span><b>Tu iPhone no deja guardar el progreso</b><small>Toca aquí para ver cómo arreglarlo.</small></span></div>`:'';
  $('#stWarnBox').innerHTML=warn;const sw=$('#stWarn');if(sw)sw.onclick=openData;
  $('#tiles').innerHTML=
    tile('clasico','Partida completa','Clásico','Compra, construye y lleva a la quiebra a tus tres rivales.',`<span>Ganadas: ${PROF.stats.modes.clasico.w}</span>`,sc&&liveTxt(sc),sc?two('clasico'):one('clasico','Jugar'))+
    tile('golpe','Partida rápida','El Golpe','Tira cuanto quieras y plántate antes de que te pillen.',`<span>Ganadas: ${PROF.stats.modes.golpe.w}</span>`,sg&&liveTxt(sg),sg?two('golpe'):one('golpe','Jugar'))+
    tile('imperio','Campaña','Imperio','Conquista barrios y ciudades. Sube de nivel y mejora.',`<span>Nivel ${PROF.level}</span><span>${zonesDone} zonas</span><span>${fmt(PROF.capital)}</span>`,si&&si.imp&&`${esc(zoneOf(si.imp.zi).name)} · ronda ${si.round}`,
      si&&si.imp?`<button class="btn white" type="button" data-act="cont" data-m="imperio">${ic('play')}Continuar</button><button class="btn glass" type="button" data-act="map">Mapa</button>`:`<button class="btn white" type="button" data-act="map">${ic('play')}Abrir campaña</button>`,
      dailyReady()?`<span class="t-badge">${ic('gift')}Regalo diario</span>`:'');
  $('#tiles').querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{e.stopPropagation();homeAction(b.dataset.act,b.dataset.m)});
  $('#tiles').querySelectorAll('.tile').forEach(t=>{const go=()=>{const b=t.querySelector('.t-acts .btn');b&&b.click()};t.onclick=go;t.onkeydown=e=>{if(e.key==='Enter')go()}});
}
async function homeAction(act,m){
  Snd.get();
  if(act==='map'){openHub();return}
  if(act==='cont'){const sv=loadSave(m);if(sv)boot(sv);return}
  if(act==='new'){
    const sv=loadSave(m);
    if(sv){const v=await ask('¿Empezar una partida nueva?',`<p class="lead">Ya tienes una partida de <b>${MODES.find(x=>x.id===m).n}</b> en curso (ronda ${sv.round}). Si empiezas otra, esa se borrará.</p>`,[{label:'Cancelar',v:false},{label:'Empezar nueva',cls:'red',v:true}]);if(!v)return;clearSave(m)}
    boot(newGame(PROF.name||'Marcel',PROF.token||'hat',m));
  }
}
function openProfile(){
  const m=modal({title:'Tu perfil',closable:true,onClose:renderHome});
  const draw=()=>{
    const p={color:SEAT_COLORS[0],token:PROF.token||'hat'};
    m.body.innerHTML=`<div class="prof-head">${disc(p)}<div><b>${esc(PROF.name||'Marcel')}</b><span class="note">Nivel ${PROF.level} · ${PROF.stats.wins} partidas ganadas</span></div></div>
    <label class="fl" for="pname" style="margin-top:16px">Tu nombre</label><input id="pname" maxlength="14" autocomplete="off" value="${esc(PROF.name||'Marcel')}">
    <div class="fl" style="margin-top:16px">Tu ficha</div><div class="tokgrid">${TOKENS.map(t=>`<button type="button" data-t="${t.id}" class="${(PROF.token||'hat')===t.id?'on':''}" ${tokOk(t)?'':'disabled'}>${disc({color:SEAT_COLORS[0],token:t.id})}${tokOk(t)?t.n:'Nivel '+t.lv}</button>`).join('')}</div>`;
    const inp=m.body.querySelector('#pname');inp.oninput=()=>{PROF.name=inp.value.trim().slice(0,14)||'Marcel';saveProf();m.body.querySelector('.prof-head b').textContent=PROF.name};
    m.body.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{PROF.token=b.dataset.t;pickTok=PROF.token;saveProf();Snd.tick();draw()});
  };
  draw();m.btn('Listo','pri',()=>m.close());
}
function goStart(){
  $('#hub').hidden=true;
  RUN++;PAUSED=false;closeAll();closeSide();G=null;updPause();applyZone(null);
  $('#start').hidden=false;
  if(!tokOk(TOKENS.find(t=>t.id===PROF.token)||{}))PROF.token='hat';
  updSpeed();
  $('#bInstall2').hidden=isStandalone();
  renderHome();
}
$('#hProfile').onclick=openProfile;
$('#hSettings').onclick=openMenu;
function boot(g){
  RUN++;PAUSED=false;closeAll();closeSide();G=g;updPause();
  $('#start').hidden=true;$('#hub').hidden=true;
  CAM.mode=CAM.pref;
  applyZone(g.mode==='imperio'&&g.imp?zoneOf(g.imp.zi):null);
  for(const i in g.props)delete g.props[i].pend;g.loot=null;
  g.track=g.track||{rentIn:0,buys:0,builds:0,streets:{}};
  g.mode=g.mode||'clasico';renderLoot(null);$('#banner').classList.remove('show');$('#evChip').hidden=true;$('#toasts').innerHTML='';
  buildBoard();createTokens();buildPlayerRows();renderLog();render();layout();
  $('#diceSum').textContent='';setDie($('#d1'),1);setDie($('#d2'),1);
  if(G.started)say(`Partida recuperada. Ronda ${G.round}.`);
  gameLoop();
}
if(window.__PWA__&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
applyLook();if(PROF.token)pickTok=PROF.token;
addEventListener('pagehide',()=>{saveProf()});document.addEventListener('visibilitychange',()=>{if(document.hidden)saveProf()});
updSound();updSpeed();updPause();
buildCubes();setDie($('#d1'),1);setDie($('#d2'),1);
buildBoard();layout();goStart();
hydrate().then(async ch=>{if(ch){PROF=loadProf();try{Object.assign(CFG,JSON.parse(kvGet(CFG_KEY)||'{}'))}catch(e){}applyLook();updSound();updSpeed()}await storageHealth();if(!$('#start').hidden)renderHome();saveProf()});
</script>

</body>
</html>
